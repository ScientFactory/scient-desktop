<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title description">
  <title id="title">Compact dose response figure</title>
  <desc id="description">Four dose levels with a rising response.</desc>
  <rect width="640" height="240" rx="20" fill="#f8fafc"/>
  <g fill="#0f172a" font-family="system-ui, sans-serif">
    <text x="36" y="42" font-size="24" font-weight="650">Dose response</text>
    <text x="36" y="206" font-size="15">Dose (mg)</text>
  </g>
  <g fill="#0ea5e9">
    <rect x="150" y="150" width="72" height="38" rx="6"/>
    <rect x="250" y="120" width="72" height="68" rx="6"/>
    <rect x="350" y="82" width="72" height="106" rx="6"/>
    <rect x="450" y="54" width="72" height="134" rx="6"/>
  </g>
</svg>
