[package]
name = "t3-resource-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# SCIENT-FORK:START — ship the binary under the Scient helper name while the
# crate keeps T3's package name (and Cargo.lock entry). Keep it equal to
# SCIENT_HELPER_EXECUTABLES in packages/shared/src/scientDesktopIdentity.ts.
[[bin]]
name = "scient-resource-monitor"
path = "src/main.rs"
# SCIENT-FORK:END

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
