name: Deploy Scient cloud

# Manual only: conversation copies and shared links go live when the owner runs this.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Alchemy stage (prod uses cloud.scientfactory.com, scientfactory.com/s/*, share.scientusercontent.com).
        type: string
        default: prod

permissions:
  contents: read

concurrency:
  group: scient-cloud-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Scient cloud Worker
    if: ${{ github.repository == 'ScientFactory/scient-desktop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: scient-cloud
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      SCIENT_CLOUD_API_HOST: ${{ vars.SCIENT_CLOUD_API_HOST }}
      SCIENT_CLOUD_PAGE_HOST: ${{ vars.SCIENT_CLOUD_PAGE_HOST }}
      SCIENT_CLOUD_CONTENT_HOST: ${{ vars.SCIENT_CLOUD_CONTENT_HOST }}
      SCIENT_CLOUD_APP_ORIGINS: ${{ vars.SCIENT_CLOUD_APP_ORIGINS }}
      SCIENT_CLOUD_FREE_BYTES: ${{ vars.SCIENT_CLOUD_FREE_BYTES }}
      SCIENT_CLOUD_MAX_SNAPSHOT_BYTES: ${{ vars.SCIENT_CLOUD_MAX_SNAPSHOT_BYTES }}
      SCIENT_CLOUD_MAX_BLOB_BYTES: ${{ vars.SCIENT_CLOUD_MAX_BLOB_BYTES }}
      SCIENT_CLOUD_MAX_THREADS: ${{ vars.SCIENT_CLOUD_MAX_THREADS }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@scientfactory/scient-cloud-worker...
              - --filter=@t3tools/web...

      - name: Build the share page and deploy
        run: vp run --filter @scientfactory/scient-cloud-worker deploy --stage "$STAGE" --yes --no-input
        env:
          STAGE: ${{ inputs.stage }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SCIENT_CLOUD_KEK: ${{ secrets.SCIENT_CLOUD_KEK }}
          SCIENT_CLOUD_ADMIN_TOKEN: ${{ secrets.SCIENT_CLOUD_ADMIN_TOKEN }}
