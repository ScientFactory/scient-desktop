name: Promote main to release/stable

on:
  workflow_dispatch:
    inputs:
      beta_version:
        description: "Optional published Beta version whose exact source was accepted"
        required: false
        default: ""
        type: string
      source_sha:
        description: "Exact green main commit to promote"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: scient-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Exact-commit promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact current main and successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BETA_VERSION: ${{ inputs.beta_version }}
        run: |
          set -euo pipefail
          git fetch origin main release/stable || git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ -n "$BETA_VERSION" ]]; then
            [[ "$BETA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]{8}\.[1-9][0-9]*$ ]] || exit 1
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
            beta_repository="ScientFactory/scient-desktop-beta"
            gh release view "v$BETA_VERSION" --repo "$beta_repository" --json isDraft,isPrerelease |
              jq -e '.isDraft == false and .isPrerelease == true' >/dev/null
            mkdir "$RUNNER_TEMP/accepted-beta"
            gh release download "v$BETA_VERSION" --repo "$beta_repository" --pattern scient-release-handoff.json --dir "$RUNNER_TEMP/accepted-beta"
            source_tree="$(git rev-parse "$SOURCE_SHA^{tree}")"
            jq -e --arg sha "$SOURCE_SHA" --arg tree "$source_tree" --arg version "$BETA_VERSION" --arg repository "$GITHUB_REPOSITORY" --arg distribution "$beta_repository" '
              .schemaVersion == 1 and .product == "Scient" and .version == $version and
              .tag == ("v" + $version) and .source.repository == $repository and
              .source.commit == $sha and .source.tree == $tree and
              .distribution.channel == "beta" and .distribution.repository == $distribution
            ' "$RUNNER_TEMP/accepted-beta/scient-release-handoff.json" >/dev/null
          else
            [[ "$SOURCE_SHA" == "$main_sha" ]] || {
              echo "Selected source $SOURCE_SHA is not current origin/main $main_sha." >&2
              exit 1
            }
          fi
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SOURCE_SHA" --limit 20 --json headSha,status,conclusion)"
          jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' \
            <<<"$result" >/dev/null || {
              echo "No successful CI workflow was found for $SOURCE_SHA." >&2
              exit 1
            }
      - name: Fast-forward release/stable to the exact main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/release/stable"
          promoted_sha="$(git ls-remote origin refs/heads/release/stable | awk 'NR == 1 { print $1 }')"
          [[ "$promoted_sha" == "$SOURCE_SHA" ]] || {
            echo "release/stable resolved to $promoted_sha after promotion, not $SOURCE_SHA." >&2
            exit 1
          }
          echo "Promoted $SOURCE_SHA without creating a commit or changing its tree." >> "$GITHUB_STEP_SUMMARY"
