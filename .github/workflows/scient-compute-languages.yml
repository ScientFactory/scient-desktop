name: Scient Compute Languages

# Installs every language Run starts that anyone can install, on each kind of computer, and runs a
# real file in each through Run. A language that is installed but does not run fails the job.
on:
  pull_request:
    paths:
      - "packages/contracts/src/scient/computeRunTable.ts"
      - "apps/server/src/scient/analysis/RunTableAdapter.ts"
      - "apps/server/src/scient/analysis/RunTableAdapter.live.test.ts"
      - "apps/server/src/scient/compute/ToolScan.ts"
      - "apps/server/src/scient/compute/ToolCatalog.ts"
      - "apps/server/src/scient/execution/**"
      - "apps/server/scripts/install-run-languages.ts"
      - ".github/workflows/scient-compute-languages.yml"
  schedule:
    # Weekly: package managers move without us, and this catches what that breaks.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scient-compute-languages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    name: ${{ matrix.group }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Leaves room on the shared runners for everyone's CI.
      max-parallel: 8
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
        group: [compiled, scripts, functional, math, lab]
        include:
          - runner: ubuntu-24.04
            group: heavy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install ${{ matrix.group }}
        run: node apps/server/scripts/install-run-languages.ts ${{ matrix.group }}

      - name: Run a real file in each
        working-directory: apps/server
        env:
          SCIENT_TEST_RUN_TABLE: "1"
        run: vp test run src/scient/analysis/RunTableAdapter.live.test.ts --maxWorkers=1

      - name: Every language installed
        if: ${{ !cancelled() }}
        run: |
          if [ -n "${SCIENT_RUN_LANGUAGES_NOT_INSTALLED:-}" ]; then
            echo "::error::Could not install: ${SCIENT_RUN_LANGUAGES_NOT_INSTALLED}"
            exit 1
          fi
