name: Promote managed provider runtime updates

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-provider-runtime-update-scan
  cancel-in-progress: false

jobs:
  provider:
    name: ${{ matrix.provider }} stable channel
    strategy:
      fail-fast: false
      matrix:
        provider:
          - codex
          - claudeAgent
          - antigravity
          - cursor
          - droid
          - grok
    uses: ./.github/workflows/managed-provider-runtime-update-provider.yml
    with:
      provider: ${{ matrix.provider }}
    secrets: inherit
