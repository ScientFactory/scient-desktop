name: Promote managed provider runtime updates

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-provider-runtime-updates
  cancel-in-progress: false

jobs:
  discover:
    name: Discover stable provider releases
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.catalog.outputs.changed }}
      providers: ${{ steps.catalog.outputs.providers }}
      matrix: ${{ steps.catalog.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: source
        name: Record immutable source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: catalog
        name: Build candidate catalog from official stable channels
        run: >-
          node scripts/update-managed-runtime-catalog.ts
          --output "$RUNNER_TEMP/managed-runtime-catalog.json"

      - name: Upload immutable candidate
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-runtime-catalog-candidate
          path: ${{ runner.temp }}/managed-runtime-catalog.json
          if-no-files-found: error
          retention-days: 1

  qualify:
    name: Qualify ${{ matrix.provider }} / ${{ matrix.runner }}
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout immutable discovery source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.discover.outputs.source_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: managed-runtime-catalog-candidate
          path: ${{ runner.temp }}/managed-runtime-catalog-candidate

      - name: Exercise download, verification, smoke, activation, and removal
        run: >-
          node scripts/qualify-managed-runtime-catalog.ts
          --provider "${{ matrix.provider }}"
          --catalog "${{ runner.temp }}/managed-runtime-catalog-candidate/managed-runtime-catalog.json"

  promote:
    name: Open and auto-merge qualified catalog update
    needs: [discover, qualify]
    if: needs.discover.outputs.changed == 'true' && needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: app-token
        name: Mint least-privilege release app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout exact current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download qualified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: managed-runtime-catalog-candidate
          path: ${{ runner.temp }}/managed-runtime-catalog-candidate

      - name: Publish a gated catalog pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
          CHANGED_PROVIDERS: ${{ needs.discover.outputs.providers }}
        run: |
          set -euo pipefail
          current_main="$(git rev-parse HEAD)"
          if [[ "$current_main" != "$SOURCE_SHA" ]]; then
            echo "main moved from $SOURCE_SHA to $current_main during qualification; retry against the new source." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/managed-runtime-catalog-candidate/managed-runtime-catalog.json" \
            apps/server/src/scient/providerLifecycle/managed-runtime-catalog.json
          if git diff --quiet -- apps/server/src/scient/providerLifecycle/managed-runtime-catalog.json; then
            echo "Qualified catalog no longer differs from main."
            exit 0
          fi

          branch="automation/managed-runtime-catalog"
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add apps/server/src/scient/providerLifecycle/managed-runtime-catalog.json
          git commit \
            -m "chore(provider-runtime): promote qualified stable releases" \
            -m "Providers: $CHANGED_PROVIDERS"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" \
              origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(provider-runtime): promote qualified stable releases" \
              --body "Automated stable-provider catalog promotion. Every changed provider passed native download, integrity, smoke, activation, and removal qualification before this PR was created. Normal assisted install, sign-in, repair, removal, and system-runtime behavior remain owned by the application and are unchanged.")"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" --auto --squash
