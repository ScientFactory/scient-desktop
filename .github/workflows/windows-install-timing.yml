name: Windows install timing
run-name: Windows install timing of ${{ inputs.installer_url || format('{0} from run {1}', inputs.artifact, inputs.run_id) }}

# Installs a real Windows installer on a clean runner and times the install, the first launch
# and a second launch until the app is ready. Each release run's assembly dispatches it as a run
# of its own once it accepts the Windows installer, so the release never waits for it; run it by
# hand for any installer an Actions run built, or any published installer URL.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run that built the installer (a release run, or CI's Windows Packaging)
        type: string
        default: ""
      artifact:
        description: Its artifact holding exactly one installer .exe (release runs desktop-win-x64; CI windows-packaging-slim-installer)
        type: string
        default: desktop-win-x64
      artifact_id:
        description: That artifact's ID, downloaded by ID (a release passes it); blank downloads the newest artifact of that name
        type: string
        default: ""
      installer_url:
        description: Or an HTTPS URL of a published installer (leave run_id blank)
        type: string
        default: ""
      version:
        description: The installer's version, if known (a release passes its own)
        type: string
        default: ""
      samples:
        description: Installs to time; each launches the app twice. The median is reported
        type: number
        default: 3

permissions:
  contents: read
  actions: read

jobs:
  timing:
    name: Windows install and launch timing
    runs-on: windows-2025
    # Above the sum of the step bounds below (59 minutes); a normal run takes about 4 minutes, and
    # twice that when a regression is re-checked.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Identify the installer
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT: ${{ inputs.artifact }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          INSTALLER_URL: ${{ inputs.installer_url }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p timing
          node .github/scripts/windows-install-timing-baseline.mjs source --out timing/context.json \
            --run-id "$RUN_ID" --artifact "$ARTIFACT" --artifact-id "$ARTIFACT_ID" \
            --installer-url "$INSTALLER_URL" --version "$VERSION"
      - name: Download the installer artifact
        if: inputs.installer_url == ''
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_id == '' && inputs.artifact || '' }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: installer
      - name: Download the installer
        if: inputs.installer_url != ''
        timeout-minutes: 5
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.installer_url }}
        run: |
          $uri = [Uri]$env:INSTALLER_URL
          New-Item -ItemType Directory -Path installer | Out-Null
          $watch = [Diagnostics.Stopwatch]::StartNew()
          Invoke-WebRequest -Uri $uri -OutFile (Join-Path installer ([IO.Path]::GetFileName($uri.AbsolutePath)))
          Write-Host "Downloaded in $($watch.ElapsedMilliseconds) ms"
      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $found = @(Get-ChildItem installer -Recurse -File -Filter *.exe)
          if ($found.Count -ne 1) { throw "Expected exactly one installer .exe, found $($found.Count): $($found.Name -join ', ')" }
          "path=$($found[0].FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($found[0].Name), $($found[0].Length) bytes"
      # A 12-minute measurement budget (four times a normal run), then up to 5 minutes to stop the
      # app and uninstall the sample in progress. measurement.json is rewritten after each sample.
      - name: Time install and launches
        id: measure
        timeout-minutes: 18
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          SAMPLES: ${{ inputs.samples }}
        run: node .github/scripts/windows-install-timing.mjs "$INSTALLER" timing "$SAMPLES"
      # After the measurement, so a lookup problem can never stop it; it falls back to the committed
      # baseline by itself.
      - name: Find the previous release's numbers
        id: baseline
        if: ${{ !cancelled() && hashFiles('timing/measurement.json') != '' }}
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/windows-install-timing-baseline.mjs find --context timing/context.json \
            --committed .github/windows-install-timing-baseline.json --dir "$RUNNER_TEMP/baselines"
      - name: Check against the baseline
        id: check
        if: ${{ !cancelled() && steps.measure.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.file || '.github/windows-install-timing-baseline.json' }}
        run: |
          node .github/scripts/windows-install-timing-report.mjs --check \
            --measurement timing/measurement.json --baseline "$BASELINE"
      # A stage slower than the baseline's record is re-checked against the baseline's own installer,
      # timed after this one on the same runner; runner speed alone moves a whole timing. It is the
      # exact upload the baseline timed when its record names one, and runs only if its SHA-256 is
      # the record's.
      - name: Identify the baseline's installer
        id: baseline_source
        if: ${{ !cancelled() && steps.check.outputs.regressed == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.file || '.github/windows-install-timing-baseline.json' }}
        run: node .github/scripts/windows-install-timing-baseline.mjs installer --baseline "$BASELINE"
      - name: Download the baseline's installer artifact
        if: ${{ !cancelled() && steps.baseline_source.outputs.run_id != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline_source.outputs.run_id }}
          name: ${{ steps.baseline_source.outputs.artifact_id == '' && steps.baseline_source.outputs.artifact || '' }}
          artifact-ids: ${{ steps.baseline_source.outputs.artifact_id }}
          path: baseline-installer
      - name: Download the baseline's installer
        if: ${{ !cancelled() && steps.baseline_source.outputs.url != '' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          INSTALLER_URL: ${{ steps.baseline_source.outputs.url }}
        run: |
          mkdir -p baseline-installer
          curl -fsSL --retry 3 -o "baseline-installer/${INSTALLER_URL##*/}" "$INSTALLER_URL"
      - name: Verify the baseline's installer
        id: baseline_installer
        if: ${{ !cancelled() && steps.baseline_source.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          EXPECTED: ${{ steps.baseline_source.outputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=(baseline-installer/**/*.exe)
          [[ ${#found[@]} -eq 1 ]] || { echo "Expected one installer .exe, found ${#found[@]}." >&2; exit 1; }
          actual="$(sha256sum "${found[0]}" | cut -d ' ' -f 1)"
          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "The downloaded installer's SHA-256 is $actual, not the baseline's $EXPECTED; not running it." >&2
            exit 1
          fi
          echo "path=${found[0]}" >> "$GITHUB_OUTPUT"
      - name: Time the baseline's installer again
        if: ${{ !cancelled() && steps.baseline_installer.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 18
        shell: bash
        env:
          INSTALLER: ${{ steps.baseline_installer.outputs.path }}
          SAMPLES: ${{ inputs.samples }}
        run: node .github/scripts/windows-install-timing.mjs "$INSTALLER" timing/baseline-rerun "$SAMPLES"
      - name: Compare and summarize
        if: ${{ !cancelled() && hashFiles('timing/measurement.json') != '' }}
        timeout-minutes: 1
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.file || '.github/windows-install-timing-baseline.json' }}
          COMMITTED: ${{ steps.baseline.outputs.committed || 'true' }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$COMMITTED" == true ]] && flags+=(--committed-baseline)
          [[ -f timing/baseline-rerun/measurement.json ]] && flags+=(--rerun timing/baseline-rerun/measurement.json)
          node .github/scripts/windows-install-timing-report.mjs \
            --measurement timing/measurement.json --context timing/context.json \
            --baseline "$BASELINE" "${flags[@]}" \
            --out timing/windows-install-timing.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        with:
          name: windows-install-timing
          path: timing
          if-no-files-found: warn
          retention-days: 90
