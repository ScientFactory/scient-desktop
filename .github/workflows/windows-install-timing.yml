name: Windows install timing

on:
  push:
    branches: [claude/windows-install-timing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    name: Windows install timing (${{ matrix.scan }} scanning)
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scan: [on, off]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Set virus scanning ${{ matrix.scan }}
        shell: pwsh
        run: |
          $disable = '${{ matrix.scan }}' -eq 'off'
          if (-not $disable) {
            # The runner image turns real-time scanning off by policy; lift the policy first.
            Remove-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender' -Recurse -Force -ErrorAction SilentlyContinue
            Start-Service WinDefend -ErrorAction SilentlyContinue
          }
          try { Set-MpPreference -DisableRealtimeMonitoring $disable -ErrorAction Stop } catch { Write-Host "Set-MpPreference failed: $_" }
          Start-Sleep -Seconds 5
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-PhysicalDisk | Select-Object FriendlyName, MediaType | Format-List
      - name: Download the installer
        shell: pwsh
        run: |
          $url = 'https://downloads.scientfactory.com/scient-desktop/v0.6.34/Scient-0.6.34-x64.exe'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\Scient-setup.exe"
          Write-Host "Download took $($watch.ElapsedMilliseconds) ms"
      - name: Time install and launches
        shell: pwsh
        run: node .github/scripts/windows-install-timing.mjs "$env:RUNNER_TEMP\Scient-setup.exe" timing "scan-${{ matrix.scan }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-install-timing-${{ matrix.scan }}
          path: timing
          retention-days: 7
