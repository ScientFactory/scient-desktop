name: Scient LaTeX Managed Install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/scient-latex-managed-install.yml"
      - "apps/server/src/scient/latex/TinyTexAssetSmoke.test.ts"
      - "apps/server/src/scient/latex/tinytexManifest.ts"
      - "apps/server/src/scient/latex/LatexArchiveUnpacker.ts"
      - "apps/server/src/scient/latex/LatexManagedToolchain.ts"
      - "apps/server/src/scient/latex/LatexPackageInstaller.ts"
      - "apps/server/src/scient/latex/LatexSyncTex.ts"
      - "apps/server/src/scient/latex/LatexToolchain.ts"
      - "apps/server/src/scient/latex/SyncTexRuntime.ts"
      - "apps/server/src/scient/latex/latexCommand.ts"
      - "apps/server/src/scient/latex/managedLatexInstall.ts"
      - "apps/server/src/scient/latex/latexTexDirectory.ts"
      - "apps/server/src/processRunner.ts"
      - "packages/shared/src/hostProcess.ts"
      - "scripts/stage-synctex-runtime.ts"
      # The build service's real-engine scenarios, run on the Linux leg.
      - "apps/server/src/scient/latex/LatexRealEngine.test.ts"
      - "apps/server/src/scient/latex/latexRealEngine.testkit.ts"
      - "apps/server/src/scient/latex/LatexBuildService.ts"
      - "apps/server/src/scient/latex/latexBuildCompletion.testkit.ts"
      - "apps/server/src/scient/execution/LocalExecutionProcess.ts"
      - "apps/server/src/scient/execution/LocalOwnedProcess.ts"
      - "apps/server/src/scient/documentArtifacts/GeneratedDocumentStore.ts"
      - "apps/server/src/scient/workspace/fileExchange.testkit.ts"
      - "apps/server/src/scient/workspace/filePublicationTestBuild.ts"
      - "scripts/stage-file-exchange.ts"
      - "native/file-exchange/**"

permissions:
  contents: read

concurrency:
  group: scient-latex-managed-install-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_asset:
    name: Native asset / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            runtime_platform: win
            runtime_arch: x64
            runtime_key: win32-x64
            runtime_executable: synctex.exe
          - platform: Linux x64
            runner: ubuntu-24.04
            runtime_platform: linux
            runtime_arch: x64
            runtime_key: linux-x64
            runtime_executable: synctex
            real_engine: "1"
          - platform: macOS Apple Silicon
            runner: macos-15
            runtime_platform: mac
            runtime_arch: arm64
            runtime_key: darwin-arm64
            runtime_executable: synctex
          - platform: macOS Intel
            runner: macos-15-intel
            runtime_platform: mac
            runtime_arch: x64
            runtime_key: darwin-x64
            runtime_executable: synctex

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          # The real-engine leg also builds the file-publication helper, a root script.
          run-install: |
            args:
              - --filter=t3...
              - ${{ matrix.real_engine == '1' && '--filter=@t3tools/scripts...' || '--filter=t3...' }}

      - name: Build verified bundled SyncTeX helper
        run: >-
          node scripts/stage-synctex-runtime.ts
          --platform ${{ matrix.runtime_platform }}
          --arch ${{ matrix.runtime_arch }}
          --output native/synctex-runtime/${{ matrix.runtime_key }}
          --verbose

      # The real-engine round trip reads each published PDF with Poppler.
      - name: Provide Poppler
        if: ${{ matrix.real_engine == '1' }}
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: Verify pinned native TinyTeX asset
        working-directory: apps/server
        env:
          SCIENT_TINYTEX_ASSET_SMOKE: "1"
          SCIENT_LATEX_REAL_ENGINE_QUALIFICATION: ${{ matrix.real_engine || '0' }}
          SCIENT_SYNCTEX_RUNTIME: ${{ github.workspace }}/native/synctex-runtime/${{ matrix.runtime_key }}/${{ matrix.runtime_executable }}
        run: vp test run src/scient/latex/TinyTexAssetSmoke.test.ts
