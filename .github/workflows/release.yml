name: Scient stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact stable version, for example 0.6.0"
        required: true
        type: string
      source_sha:
        description: "Exact green main commit promoted to release/stable"
        required: true
        type: string
      publish_release:
        description: "Create the GitHub release (false is a build-only proof)"
        required: true
        default: false
        type: boolean
      allow_note_free:
        description: "Explicitly permit a release without a What's New entry"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: scient-stable-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact-commit release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      source_tree: ${{ steps.meta.outputs.source_tree }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - name: Require release/stable
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "release/stable" ]]; then
            echo "Run this workflow from release/stable, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Checkout exact release head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/shared...
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/web...

      - name: Verify exact source and approved release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ALLOW_NOTE_FREE: ${{ inputs.allow_note_free }}
        run: |
          args=(
            --version "$RELEASE_VERSION"
            --source-sha "$SOURCE_SHA"
            --release-sha "${GITHUB_SHA}"
          )
          if [[ "$ALLOW_NOTE_FREE" == "true" ]]; then
            args+=(--allow-note-free)
          fi
          node scripts/scient-release-preflight.ts "${args[@]}"

      - name: Require successful CI for the exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          result="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$SOURCE_SHA" \
            --limit 20 \
            --json headSha,status,conclusion)"
          if ! jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' \
            <<<"$result" >/dev/null; then
            echo "No successful CI workflow was found for exact source $SOURCE_SHA." >&2
            exit 1
          fi

      - id: meta
        name: Export immutable release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          version="$RELEASE_VERSION"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_tree=$(git rev-parse "$SOURCE_SHA^{tree}")" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

  # Scient cloud is intentionally disabled for the first migration release.
  # Keep T3's proven relay/tracing handoff visible and structurally intact so
  # enabling cloud later is a conscious gate change, not a reconstruction.
  relay_public_config:
    name: Preserve disabled cloud relay foundation
    needs: preflight
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...
      - name: Read production relay tracing config
        shell: bash
        run: |
          vp run --filter t3code-relay deploy \
            --stage prod \
            --read-state \
            --github-output \
            --github-env-file "$RUNNER_TEMP/relay-client-tracing.env"
      - name: Upload relay client tracing config
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing.env
          if-no-files-found: error
          retention-days: 1

  build_wsl_node_pty:
    name: Build WSL node-pty
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
      - name: Build Linux x64 node-pty for WSL
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp@12.3.0 rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_desktop:
    name: Package ${{ matrix.label }}
    needs: [preflight, build_wsl_node_pty]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: macOS x64
            runner: macos-26
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Download disabled relay client tracing config
        if: ${{ false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load disabled relay client tracing config
        if: ${{ false }}
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align staged package versions
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"

      - name: Download WSL native dependency
        if: matrix.platform == 'win'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $process -or $process.ExitCode -ne 0) {
            $code = if ($null -ne $process) { $process.ExitCode } else { 1 }
            throw "Visual Studio Installer failed with exit code $code"
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ needs.preflight.outputs.publish_release }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $required = @(
            $env:AZURE_TENANT_ID, $env:AZURE_CLIENT_ID, $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT, $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          $complete = -not ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          if (-not $complete) {
            if ($env:PUBLISH_RELEASE -eq "true") { throw "Windows signing is required for publication." }
            "SCIENT_WINDOWS_SIGNING_READY=false" >> $env:GITHUB_ENV
            exit 0
          }
          Install-Module TrustedSigning -RequiredVersion 0.5.0 -Force -AllowClobber -Scope CurrentUser
          Import-Module TrustedSigning -RequiredVersion 0.5.0 -Force
          "SCIENT_WINDOWS_SIGNING_READY=true" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
          PUBLISH_RELEASE: ${{ needs.preflight.outputs.publish_release }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ScientFactory/scient-desktop-next
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
        run: |
          set -euo pipefail
          args=(
            --platform "$RELEASE_PLATFORM"
            --target "$RELEASE_TARGET"
            --arch "$RELEASE_ARCH"
            --build-version "$RELEASE_VERSION"
            --verbose
          )
          signed=false
          key_path=""
          cleanup_key() { [[ -z "$key_path" ]] || rm -f "$key_path"; }
          trap cleanup_key EXIT
          has_all() { for value in "$@"; do [[ -n "$value" ]] || return 1; done; }
          if [[ "$RELEASE_PLATFORM" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              args+=(--signed)
              signed=true
            elif [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "macOS signing and notarization configuration is required for publication." >&2
              exit 1
            fi
          elif [[ "$RELEASE_PLATFORM" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            if [[ "${SCIENT_WINDOWS_SIGNING_READY:-false}" == "true" ]]; then
              args+=(--signed)
              signed=true
            fi
          fi
          vp run dist:desktop:artifact "${args[@]}"
          cleanup_key
          trap - EXIT
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in release/*.dmg release/*.zip release/*.AppImage release/*.exe release/*.blockmap release/*.yml; do
            for file in $pattern; do cp "$file" release-publish/; done
          done
          if [[ "$RELEASE_PLATFORM" == "mac" && "$RELEASE_ARCH" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do mv "$manifest" "${manifest%.yml}-x64.yml"; done
          fi
          printf '{"platform":"%s","arch":"%s","signed":%s}\n' \
            "$RELEASE_PLATFORM" "$RELEASE_ARCH" "$signed" \
            > "release-publish/signing-$RELEASE_PLATFORM-$RELEASE_ARCH.json"
          if [[ "$RELEASE_PLATFORM" == "mac" ]]; then
            echo "SCIENT_MAC_SIGNING_READY=$signed" >> "$GITHUB_ENV"
          fi

      - name: Verify macOS signing and notarization
        if: matrix.platform == 'mac' && env.SCIENT_MAC_SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release-publish/*.dmg)
          zips=(release-publish/*.zip)
          [[ ${#dmgs[@]} -eq 1 && ${#zips[@]} -eq 1 ]] || {
            echo "Expected exactly one macOS DMG and one updater ZIP." >&2
            exit 1
          }
          mount_dir="$(mktemp -d)"
          zip_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rm -rf "$mount_dir" "$zip_dir"
          }
          trap cleanup EXIT
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          dmg_apps=("$mount_dir"/*.app)
          [[ ${#dmg_apps[@]} -eq 1 ]] || { echo "Signed DMG does not contain exactly one app." >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${dmg_apps[0]}"
          xcrun stapler validate "${dmg_apps[0]}"
          spctl --assess --type execute --verbose=2 "${dmg_apps[0]}"
          ditto -x -k "${zips[0]}" "$zip_dir"
          zip_apps=("$zip_dir"/*.app)
          [[ ${#zip_apps[@]} -eq 1 ]] || { echo "Updater ZIP does not contain exactly one app." >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${zip_apps[0]}"
          xcrun stapler validate "${zip_apps[0]}"
          spctl --assess --type execute --verbose=2 "${zip_apps[0]}"

      - name: Verify Windows signature
        if: matrix.platform == 'win' && env.SCIENT_WINDOWS_SIGNING_READY == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-publish/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Windows signature: $($signature.Status)" }

      - name: Collect resource monitor
        shell: bash
        run: |
          binary=t3-resource-monitor
          [[ "${{ matrix.platform }}" == "win" ]] && binary=t3-resource-monitor.exe
          source="native/resource-monitor/target/${{ matrix.rust_target }}/release/$binary"
          mkdir -p "resource-monitor/${{ matrix.resource_key }}"
          cp "$source" "resource-monitor/${{ matrix.resource_key }}/$binary"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor/${{ matrix.resource_key }}/*
          if-no-files-found: error

  build_server_asset:
    name: Package exact remote server asset
    needs: [preflight, build_desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Align package versions and build server
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          vp run --filter @t3tools/web build
          vp run --filter t3 build:bundle
          cp -R apps/web/dist apps/server/dist/client
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: resource-monitor-*
          path: resource-monitors
      - name: Add native monitors and create tarball
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          for dir in resource-monitors/resource-monitor-*; do
            key="${dir##*/resource-monitor-}"
            mkdir -p "apps/server/dist/resource-monitor/$key"
            cp "$dir"/t3-resource-monitor* "apps/server/dist/resource-monitor/$key/"
            chmod +x "apps/server/dist/resource-monitor/$key/t3-resource-monitor" 2>/dev/null || true
          done
          node scripts/package-scient-server.ts \
            --version "$RELEASE_VERSION" \
            --output-dir release-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scient-server
          path: release-server/*
          if-no-files-found: error

  assemble:
    name: Assemble and attest release
    needs: [preflight, build_desktop, build_server_asset]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scient-server
          path: release-assets
      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64 in release-assets/*-mac-x64.yml; do
            arm64="${x64%-x64.yml}.yml"
            [[ -f "$arm64" ]] || { echo "Missing arm64 manifest for $x64" >&2; exit 1; }
            node scripts/merge-update-manifests.ts --platform mac "$arm64" "$x64"
            rm "$x64"
          done
      - name: Require signed publication inputs
        if: needs.preflight.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attestation in release-assets/signing-mac-arm64.json release-assets/signing-mac-x64.json release-assets/signing-win-x64.json; do
            jq -e '.signed == true' "$attestation" >/dev/null || {
              echo "Publication requires signed native artifacts: $attestation" >&2
              exit 1
            }
          done
      - name: Remove internal signing attestations
        run: rm release-assets/signing-*.json
      - name: Verify complete updater and server artifact set
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/verify-scient-release-assets.ts \
            --assets-dir release-assets \
            --version "$RELEASE_VERSION"
      - name: Create checksums and compatibility handoff
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
        run: |
          node scripts/create-scient-release-handoff.ts \
            --assets-dir release-assets \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --output "release-assets/scient-release-handoff.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scient-release-v${{ needs.preflight.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: needs.preflight.outputs.publish_release == 'true'
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - name: Require explicit repository release gate
        env:
          RELEASES_ENABLED: ${{ vars.SCIENT_DESKTOP_RELEASES_ENABLED }}
        run: |
          [[ "$RELEASES_ENABLED" == "true" ]] || {
            echo "SCIENT_DESKTOP_RELEASES_ENABLED must equal true." >&2
            exit 1
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scient-release-v${{ needs.preflight.outputs.version }}
          path: release-assets
      - name: Refuse to overwrite an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to repurpose it." >&2
            exit 1
          fi
      - name: Stage, verify, and publish the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Scient v$RELEASE_VERSION" \
            --generate-notes \
            --draft \
            --latest=false

          mkdir published-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-assets
          (cd release-assets && sha256sum -- * | sort) > "$RUNNER_TEMP/expected-release-sha256.txt"
          (cd published-assets && sha256sum -- * | sort) > "$RUNNER_TEMP/published-release-sha256.txt"
          diff -u "$RUNNER_TEMP/expected-release-sha256.txt" "$RUNNER_TEMP/published-release-sha256.txt"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$latest_tag" == "$RELEASE_TAG" ]] || {
            echo "Published release is not current Latest ($latest_tag)." >&2
            exit 1
          }
          tag_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
            echo "$RELEASE_TAG resolves to $tag_sha, not $SOURCE_SHA." >&2
            exit 1
          }
