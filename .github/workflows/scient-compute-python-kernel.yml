# Runs the part of the compute session's Python work that the main CI lanes
# cannot: a real Jupyter kernel, on more than one operating system and more than
# one interpreter version.
#
# The bridge's own unit tests need nothing but a standard library and so run on
# every pull request from `ci.yml`. What is here needs `jupyter_client`,
# `ipykernel`, matplotlib, pandas, and a live subprocess tree, which is why it
# is conditionally called by CI and remains manually dispatchable.
#
# Every proof runs on the four computers Scient ships for: Apple Silicon, Intel
# Mac, Windows x64 and Linux x64. Macs run theirs in the `macos` job.
name: Scient Compute Python Kernel

on:
  workflow_call:
    inputs:
      real_kernel:
        type: boolean
        default: true
      managed_python:
        type: boolean
        default: true
      # Only the Compute product case changed: run it alone, on Linux with Python 3.12.
      # Every real-kernel run includes it.
      python_product:
        type: boolean
        default: false
      # `linux` when only broad inputs (dependencies, configuration, workspace
      # code) changed; see compute-ci-gate.mjs. Anything else runs all four.
      platforms:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      real_kernel:
        description: Run the real-kernel OS and Python-version matrix
        type: boolean
        default: true
      managed_python:
        description: Provision and qualify managed Python toolkits
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: scient-compute-python-kernel-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  managed_python:
    if: ${{ inputs.managed_python }}
    name: Managed Python toolkits / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.platforms == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2025"]') }}
    defaults:
      run:
        shell: bash
    steps:
      # The runner's C: drive is slow for many small files; its D: drive, which holds the
      # workspace, is several times faster. Temporary files (build stages, Python
      # environments, extracted archives) go there.
      - name: Use the D drive for temporary files
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      # No package cache in this workflow: on the Macs restoring the 0.9–1.6 GB store took longer
      # than installing the filtered workspace from the registry (Apple Silicon 102–174 s against
      # 41–52 s), and the cache's post step packed it again after every job. Windows and Linux
      # measured the same either way.
      # pnpm accepts an earlier pass for the same lockfile and policy, so a cached record skips
      # re-checking every package's registry metadata (13-29 s on the Intel Mac).
      - name: Keep pnpm metadata beside the job
        run: echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-metadata" >> "$GITHUB_ENV"
      - name: Restore lockfile verification
        id: pnpm_verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=t3...
      - name: Save lockfile verification
        if: ${{ github.event_name != 'merge_group' && steps.pnpm_verified.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}
      # The production provisioner downloads pinned private uv/CPython and uses
      # the checked-in lock. No ambient pip environment can satisfy this test.
      - name: Seal candidate recipe metadata
        run: node apps/server/scripts/compute-recipes.ts seal
      - name: Assert native qualification target
        env:
          EXPECTED_TARGET: ${{ fromJSON('{"ubuntu-24.04":"linux-x64","macos-15":"darwin-arm64","macos-15-intel":"darwin-x64","windows-2025":"win32-x64"}')[matrix.runner] }}
        run: node -e 'require("node:assert/strict").equal(`${process.platform}-${process.arch}`, process.env.EXPECTED_TARGET)'
      # Windows qualifies recipes in managed_recipes, beside this, its longest job.
      - name: Qualify recipes
        if: ${{ matrix.runner != 'windows-2025' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_MANAGED_PYTHON: "1"
          MPLBACKEND: Agg
        run: vp test run src/scient/compute/ComputeRecipe.live.test.ts --maxWorkers=1
      - name: Qualify base, every toolkit combination, and retained kernels
        working-directory: apps/server
        env:
          SCIENT_TEST_MANAGED_PYTHON: "1"
          MPLBACKEND: Agg
        run: vp test bench --run src/scient/compute/ManagedPythonProduct.bench.ts --maxWorkers=1

  managed_recipes:
    if: ${{ inputs.managed_python && inputs.platforms != 'linux' }}
    name: Managed Python recipes / windows-2025
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # The runner's C: drive is slow for many small files; its D: drive, which holds the
      # workspace, is several times faster. Temporary files (build stages, Python
      # environments, extracted archives) go there.
      - name: Use the D drive for temporary files
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      # pnpm accepts an earlier pass for the same lockfile and policy, so a cached record skips
      # re-checking every package's registry metadata (13-29 s on the Intel Mac).
      - name: Keep pnpm metadata beside the job
        run: echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-metadata" >> "$GITHUB_ENV"
      - name: Restore lockfile verification
        id: pnpm_verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=t3...
      - name: Save lockfile verification
        if: ${{ github.event_name != 'merge_group' && steps.pnpm_verified.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}
      - name: Seal candidate recipe metadata
        run: node apps/server/scripts/compute-recipes.ts seal
      - name: Assert native qualification target
        run: node -e 'require("node:assert/strict").equal(`${process.platform}-${process.arch}`, "win32-x64")'
      - name: Qualify recipes
        working-directory: apps/server
        env:
          SCIENT_TEST_MANAGED_PYTHON: "1"
          MPLBACKEND: Agg
        run: vp test run src/scient/compute/ComputeRecipe.live.test.ts --maxWorkers=1

  real_kernel:
    if: ${{ inputs.real_kernel || inputs.python_product }}
    name: Real kernel / ${{ matrix.runner }}${{ matrix.python != 'both' && format(' / Python {0}', matrix.python) || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Windows, where setup is cheap beside the two suites, runs each version on its own runner.
      matrix:
        include: ${{ fromJSON(!inputs.real_kernel && '[{"runner":"ubuntu-24.04","python":"3.12"}]' || inputs.platforms == 'linux' && '[{"runner":"ubuntu-24.04","python":"both"}]' || '[{"runner":"ubuntu-24.04","python":"both"},{"runner":"windows-2025","python":"3.10"},{"runner":"windows-2025","python":"3.12"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the D drive for temporary files
        if: ${{ runner.os == 'Windows' }}
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # pnpm accepts an earlier pass for the same lockfile and policy, so a cached record skips
      # re-checking every package's registry metadata (13-29 s on the Intel Mac).
      - name: Keep pnpm metadata beside the job
        run: echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-metadata" >> "$GITHUB_ENV"
      - name: Restore lockfile verification
        id: pnpm_verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=t3...
      - name: Save lockfile verification
        if: ${{ github.event_name != 'merge_group' && steps.pnpm_verified.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}

      # Both ends of the supported range, because the failures this suite
      # catches are version-dependent asyncio and kernel-startup behaviour:
      # 3.10 is the floor the runtime adapter enforces, 3.12 is what a current
      # user is most likely to already have. A Mac job runs both, one after the
      # other, since Mac runners are the scarcest.
      - name: Setup Python 3.10
        if: ${{ matrix.python == 'both' || matrix.python == '3.10' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      # Importing the font manager builds matplotlib's font cache: over a minute on a fresh
      # Windows runner, which otherwise lands inside the suite's 90-second figure step.
      - name: Install kernel dependencies on Python 3.10
        if: ${{ matrix.python == 'both' || matrix.python == '3.10' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "jupyter_client>=8.6" "ipykernel>=6.29" matplotlib pandas
          python -c "import matplotlib.font_manager"

      # The absolute path rather than `python`: this value becomes the launch
      # plan's executable, so resolving it once here is what makes the kernel
      # under test the interpreter this step set up.
      - name: Run the real-kernel integration suite on Python 3.10
        if: ${{ matrix.python == 'both' || matrix.python == '3.10' }}
        working-directory: apps/server
        env:
          # Headless runners have no display, and a figure that opened a window
          # would hang the execution the test is waiting on.
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          SCIENT_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_PYTHON
          vp test run \
            src/scient/compute/PythonKernel.integration.test.ts \
            src/scient/compute/PythonComputeService.integration.test.ts \
            src/scient/compute/FreshCompute.integration.test.ts \
            src/preview/PortScannerPythonCompute.integration.test.ts

      - name: Setup Python 3.12
        if: ${{ matrix.python == 'both' || matrix.python == '3.12' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Importing the font manager builds matplotlib's font cache: over a minute on a fresh
      # Windows runner, which otherwise lands inside the suite's 90-second figure step.
      - name: Install kernel dependencies on Python 3.12
        if: ${{ matrix.python == 'both' || matrix.python == '3.12' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "jupyter_client>=8.6" "ipykernel>=6.29" matplotlib pandas
          python -c "import matplotlib.font_manager"

      # The absolute path rather than `python`: this value becomes the launch
      # plan's executable, so resolving it once here is what makes the kernel
      # under test the interpreter this step set up.
      - name: Run the real-kernel integration suite on Python 3.12
        if: ${{ inputs.real_kernel && (matrix.python == 'both' || matrix.python == '3.12') }}
        working-directory: apps/server
        env:
          # Headless runners have no display, and a figure that opened a window
          # would hang the execution the test is waiting on.
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          SCIENT_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_PYTHON
          vp test run \
            src/scient/compute/PythonKernel.integration.test.ts \
            src/scient/compute/PythonComputeService.integration.test.ts \
            src/scient/compute/FreshCompute.integration.test.ts \
            src/preview/PortScannerPythonCompute.integration.test.ts

      # The gateway, durable service and a real kernel together: saved, dirty and restored
      # source, retained figure bytes, and a relocated workspace refused. Linux only; the
      # kernel suites above cover each platform and interpreter.
      - name: Run the Compute product case on Python 3.12
        if: ${{ runner.os == 'Linux' && (matrix.python == 'both' || matrix.python == '3.12') }}
        working-directory: apps/server
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          SCIENT_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_PYTHON
          report="$RUNNER_TEMP/compute-product.json"
          vp test run src/scient/compute/ComputeProduct.integration.test.ts \
            --reporter=default --reporter=json --outputFile.json="$report"
          # The suite skips without SCIENT_TEST_PYTHON; a skip must not pass as a run.
          node -e 'const r = require(process.argv[1]); if (r.numPassedTests !== 1 || r.numTotalTests !== 1) { console.error("Expected exactly one Compute product case to run", r.numPassedTests, r.numTotalTests); process.exit(1); }' "$report"

      - name: Check saved data views with DuckDB on Python 3.12
        if: ${{ runner.os == 'Linux' && (matrix.python == 'both' || matrix.python == '3.12') }}
        working-directory: apps/server
        run: |
          set -euo pipefail
          duckdb_version="$(python -c 'import tomllib; from pathlib import Path; lock = tomllib.loads(Path("src/scient/compute/managed-python/uv.lock").read_text()); print(next(p["version"] for p in lock["package"] if p["name"] == "duckdb"))')"
          python -m pip install "duckdb==${duckdb_version}"
          DATA_VIEW_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export DATA_VIEW_TEST_PYTHON
          report="$RUNNER_TEMP/compute-data-views.json"
          vp test run src/scient/data/DataViews.live.test.ts \
            --reporter=default --reporter=json --outputFile.json="$report"
          node -e 'const r = require(process.argv[1]); if (r.numPassedTests === 0 || r.numPassedTests !== r.numTotalTests) { console.error("Expected the native data view tests to run", r.numPassedTests, r.numTotalTests); process.exit(1); }' "$report"

  real_languages:
    if: ${{ inputs.real_kernel }}
    name: Real R and Julia / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One job per computer (Apple Silicon runs these in `macos`). The three proofs share only
      # setup: each runs from a clean start (compute-roles.mjs) whatever an earlier one did.
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'linux' && '[{"runner":"ubuntu-24.04"}]' || '[{"runner":"ubuntu-24.04"},{"runner":"windows-2025"},{"runner":"macos-15-intel"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the D drive for temporary files
        if: ${{ runner.os == 'Windows' }}
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # pnpm accepts an earlier pass for the same lockfile and policy, so a cached record skips
      # re-checking every package's registry metadata (13-29 s on the Intel Mac).
      - name: Keep pnpm metadata beside the job
        run: echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-metadata" >> "$GITHUB_ENV"
      - name: Restore lockfile verification
        id: pnpm_verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Setup Vite+
        id: vp
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=t3...
      - name: Save lockfile verification
        if: ${{ github.event_name != 'merge_group' && steps.pnpm_verified.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}

      # A system install on purpose: nothing here is Scient-managed.
      - name: Setup Python
        id: languages-python
        if: ${{ !cancelled() && steps.vp.outcome == 'success' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Setup R
        id: languages-r
        if: ${{ !cancelled() && steps.vp.outcome == 'success' }}
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - name: Setup Julia
        id: languages-julia
        if: ${{ !cancelled() && steps.vp.outcome == 'success' }}
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
      # For the real files below. Before every proof, so no proof's step is skipped after another.
      - name: Match LLVM to the Visual Studio C++ library
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && runner.os == 'Windows' }}
        run: bash .github/scripts/match-windows-llvm.sh

      # Before anything is installed into this Python: it stands for a person's plain Python, on a
      # computer with nothing that can host the bridge.
      - name: Begin what people have
        id: people
        if: ${{ !cancelled() && steps.vp.outcome == 'success' }}
        run: node .github/scripts/compute-roles.mjs begin people --save-python bare
      - name: Run on what people have
        id: people-run
        if: ${{ !cancelled() && steps.people.outcome == 'success' }}
        working-directory: apps/server
        run: |
          set -euo pipefail
          SCIENT_TEST_BARE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_BARE_PYTHON
          vp test run src/scient/compute/KernelLanguages.live.test.ts --maxWorkers=1
      - name: End what people have
        id: end-people
        if: ${{ !cancelled() && steps.people.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end people --check-python bare
      - name: Begin real files
        id: files
        if: ${{ !cancelled() && steps.vp.outcome == 'success' }}
        run: node .github/scripts/compute-roles.mjs begin files
      - name: Run real files and scan this computer
        id: files-run
        if: ${{ !cancelled() && steps.files.outcome == 'success' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_RUN_TABLE: "1"
          # `dotnet run` otherwise leaves its compiler and MSBuild servers running after the
          # proof, which the role's end reports as the files proof's leftovers.
          UseSharedCompilation: "false"
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
        # A compiler's first run on a fresh computer, such as runghc or `dotnet run` on Windows, takes up
        # to two minutes, the project's ceiling, so real programs get five.
        run: vp test run src/scient/analysis/RunTableAdapter.live.test.ts --maxWorkers=1 --testTimeout=300000
      - name: End real files
        id: end-files
        if: ${{ !cancelled() && steps.files.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end files --check-python bare
      - name: Begin real R and Julia kernels
        id: kernels
        if: ${{ !cancelled() && steps.vp.outcome == 'success' }}
        run: node .github/scripts/compute-roles.mjs begin kernels
      # Into an environment of the role's own, which its end removes: the Python the other roles
      # use never gets them.
      - name: Install the bridge host's packages
        id: kernels-install
        if: ${{ !cancelled() && steps.kernels.outcome == 'success' }}
        run: node .github/scripts/compute-roles.mjs venv kernels "jupyter_client>=8.6" "ipykernel>=6.29"
      - name: Run real R and Julia kernels
        id: kernels-run
        if: ${{ !cancelled() && steps.kernels.outcome == 'success' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_KERNEL_DIR: ${{ runner.temp }}/scient-kernels
          SCIENT_TEST_PYTHON: ${{ steps.kernels-install.outputs.python }}
        run: vp test run src/scient/compute/KernelLanguages.live.test.ts --maxWorkers=1
      - name: End real R and Julia kernels
        id: end-kernels
        if: ${{ !cancelled() && steps.kernels.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end kernels --check-python bare

      - name: Name every role that failed or did not run
        if: ${{ !cancelled() }}
        env:
          EXPECTED: people files kernels
          STEPS: ${{ toJSON(steps) }}
        run: node .github/scripts/compute-roles.mjs summary

  # Mac runner slots are the scarcest: Apple Silicon runs all three roles in one job, the Intel Mac
  # managed and real Python in a job each, listed only when asked (its R and Julia run in
  # real_languages). Each role runs its own job's steps from a clean start (compute-roles.mjs)
  # whatever an earlier one did, R and Julia first for their plain Python; the last step names
  # every role that failed or did not run.
  macos:
    if: ${{ inputs.platforms != 'linux' && (inputs.managed_python || inputs.real_kernel) }}
    name: Compute on Mac / ${{ matrix.runner }}${{ matrix.part && format(' / {0}', matrix.part) || '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.managed_python && inputs.real_kernel
          && '[{"runner":"macos-15","target":"darwin-arm64","languages":true,"managed":true,"python":true},{"runner":"macos-15-intel","target":"darwin-x64","languages":false,"managed":true,"python":false,"part":"managed Python"},{"runner":"macos-15-intel","target":"darwin-x64","languages":false,"managed":false,"python":true,"part":"real Python"}]'
          || inputs.managed_python
          && '[{"runner":"macos-15","target":"darwin-arm64","languages":true,"managed":true,"python":true},{"runner":"macos-15-intel","target":"darwin-x64","languages":false,"managed":true,"python":false,"part":"managed Python"}]'
          || '[{"runner":"macos-15","target":"darwin-arm64","languages":true,"managed":true,"python":true},{"runner":"macos-15-intel","target":"darwin-x64","languages":false,"managed":false,"python":true,"part":"real Python"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      # pnpm accepts an earlier pass for the same lockfile and policy, so a cached record skips
      # re-checking every package's registry metadata (13-29 s on the Intel Mac).
      - name: Keep pnpm metadata beside the job
        run: echo "pnpm_config_cache_dir=$RUNNER_TEMP/pnpm-metadata" >> "$GITHUB_ENV"
      - name: Restore lockfile verification
        id: pnpm_verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: pnpm-verified-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
      - name: Setup Vite+
        id: vp
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=t3...
      - name: Save lockfile verification
        if: ${{ github.event_name != 'merge_group' && steps.pnpm_verified.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          key: ${{ steps.pnpm_verified.outputs.cache-primary-key }}

      # R and Julia, as in real_languages (without its Windows-only LLVM step).
      - name: Setup Python
        id: languages-python
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && matrix.languages && inputs.real_kernel }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Setup R
        id: languages-r
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && matrix.languages && inputs.real_kernel }}
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - name: Setup Julia
        id: languages-julia
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && matrix.languages && inputs.real_kernel }}
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
      - name: Begin what people have
        id: people
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && matrix.languages && inputs.real_kernel }}
        run: node .github/scripts/compute-roles.mjs begin people --save-python bare
      - name: Run on what people have
        id: people-run
        if: ${{ !cancelled() && steps.people.outcome == 'success' }}
        working-directory: apps/server
        run: |
          set -euo pipefail
          SCIENT_TEST_BARE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_BARE_PYTHON
          vp test run src/scient/compute/KernelLanguages.live.test.ts --maxWorkers=1
      - name: End what people have
        id: end-people
        if: ${{ !cancelled() && steps.people.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end people --check-python bare
      - name: Begin real files
        id: files
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && matrix.languages && inputs.real_kernel }}
        run: node .github/scripts/compute-roles.mjs begin files
      - name: Run real files and scan this computer
        id: files-run
        if: ${{ !cancelled() && steps.files.outcome == 'success' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_RUN_TABLE: "1"
          # `dotnet run` otherwise leaves its compiler and MSBuild servers running after the
          # proof, which the role's end reports as the files proof's leftovers.
          UseSharedCompilation: "false"
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
        # A compiler's first run on a fresh computer, such as runghc or `dotnet run` on Windows, takes up
        # to two minutes, the project's ceiling, so real programs get five.
        run: vp test run src/scient/analysis/RunTableAdapter.live.test.ts --maxWorkers=1 --testTimeout=300000
      - name: End real files
        id: end-files
        if: ${{ !cancelled() && steps.files.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end files --check-python bare
      - name: Begin real R and Julia kernels
        id: kernels
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && matrix.languages && inputs.real_kernel }}
        run: node .github/scripts/compute-roles.mjs begin kernels
      # Into an environment of the role's own, which its end removes: the Python the other roles
      # use never gets them.
      - name: Install the bridge host's packages
        id: kernels-install
        if: ${{ !cancelled() && steps.kernels.outcome == 'success' }}
        run: node .github/scripts/compute-roles.mjs venv kernels "jupyter_client>=8.6" "ipykernel>=6.29"
      - name: Run real R and Julia kernels
        id: kernels-run
        if: ${{ !cancelled() && steps.kernels.outcome == 'success' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_KERNEL_DIR: ${{ runner.temp }}/scient-kernels
          SCIENT_TEST_PYTHON: ${{ steps.kernels-install.outputs.python }}
        run: vp test run src/scient/compute/KernelLanguages.live.test.ts --maxWorkers=1
      # Real Python below installs into the same 3.12, which must still be the plain Python.
      - name: End real R and Julia kernels
        id: end-kernels
        if: ${{ !cancelled() && steps.kernels.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end kernels --check-python bare

      # Managed Python, as in managed_python. The production provisioner downloads pinned private
      # uv/CPython and uses the checked-in lock. No ambient pip environment can satisfy this test.
      - name: Begin managed Python
        id: managed
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && inputs.managed_python && matrix.managed }}
        run: node .github/scripts/compute-roles.mjs begin managed
      - name: Seal candidate recipe metadata
        id: managed-seal
        if: ${{ !cancelled() && steps.managed.outcome == 'success' }}
        run: node apps/server/scripts/compute-recipes.ts seal
      - name: Assert native qualification target
        id: managed-target
        if: ${{ !cancelled() && steps.managed.outcome == 'success' }}
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e 'require("node:assert/strict").equal(`${process.platform}-${process.arch}`, process.env.EXPECTED_TARGET)'
      - name: Qualify recipes
        id: managed-recipes
        if: ${{ !cancelled() && steps.managed.outcome == 'success' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_MANAGED_PYTHON: "1"
          MPLBACKEND: Agg
        run: vp test run src/scient/compute/ComputeRecipe.live.test.ts --maxWorkers=1
      - name: Qualify base, every toolkit combination, and retained kernels
        id: managed-bench
        if: ${{ !cancelled() && steps.managed.outcome == 'success' }}
        working-directory: apps/server
        env:
          SCIENT_TEST_MANAGED_PYTHON: "1"
          MPLBACKEND: Agg
        run: vp test bench --run src/scient/compute/ManagedPythonProduct.bench.ts --maxWorkers=1
      # The seal rewrote recipe metadata in the checkout; the end step restores it. Real Python
      # reuses the plain 3.12 the people role saved, so the end checks it unchanged here too.
      - name: End managed Python
        id: end-managed
        if: ${{ !cancelled() && steps.managed.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end managed ${{ steps.people.outcome == 'success' && '--check-python bare' || '' }}

      # Real Python on both supported versions, as in real_kernel.
      - name: Begin real Python
        id: python
        if: ${{ !cancelled() && steps.vp.outcome == 'success' && inputs.real_kernel && matrix.python }}
        run: node .github/scripts/compute-roles.mjs begin python
      - name: Setup Python 3.10
        id: python-setup-310
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      # Importing the font manager builds matplotlib's font cache: over a minute on a fresh
      # Windows runner, which otherwise lands inside the suite's 90-second figure step.
      - name: Install kernel dependencies on Python 3.10
        id: python-install-310
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "jupyter_client>=8.6" "ipykernel>=6.29" matplotlib pandas
          python -c "import matplotlib.font_manager"
      # The absolute path rather than `python`: this value becomes the launch
      # plan's executable, so resolving it once here is what makes the kernel
      # under test the interpreter this step set up.
      - name: Run the real-kernel integration suite on Python 3.10
        id: python-run-310
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        working-directory: apps/server
        env:
          # Headless runners have no display, and a figure that opened a window
          # would hang the execution the test is waiting on.
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          SCIENT_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_PYTHON
          vp test run \
            src/scient/compute/PythonKernel.integration.test.ts \
            src/scient/compute/PythonComputeService.integration.test.ts \
            src/scient/compute/FreshCompute.integration.test.ts \
            src/preview/PortScannerPythonCompute.integration.test.ts
      - name: Setup Python 3.12
        id: python-setup-312
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install kernel dependencies on Python 3.12
        id: python-install-312
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "jupyter_client>=8.6" "ipykernel>=6.29" matplotlib pandas
          python -c "import matplotlib.font_manager"
      - name: Run the real-kernel integration suite on Python 3.12
        id: python-run-312
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        working-directory: apps/server
        env:
          # Headless runners have no display, and a figure that opened a window
          # would hang the execution the test is waiting on.
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          SCIENT_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export SCIENT_TEST_PYTHON
          vp test run \
            src/scient/compute/PythonKernel.integration.test.ts \
            src/scient/compute/PythonComputeService.integration.test.ts \
            src/scient/compute/FreshCompute.integration.test.ts \
            src/preview/PortScannerPythonCompute.integration.test.ts
      - name: End real Python
        id: end-python
        if: ${{ !cancelled() && steps.python.outcome != 'skipped' }}
        run: node .github/scripts/compute-roles.mjs end python

      - name: Name every role that failed or did not run
        if: ${{ !cancelled() }}
        env:
          EXPECTED: ${{ format('{0} {1} {2}', matrix.languages && inputs.real_kernel && 'people files kernels' || '', inputs.managed_python && matrix.managed && 'managed' || '', inputs.real_kernel && matrix.python && 'python' || '') }}
          STEPS: ${{ toJSON(steps) }}
        run: node .github/scripts/compute-roles.mjs summary
