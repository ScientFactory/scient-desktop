name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Verify Scient product identity
        run: vp run brand:check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test_server:
    name: Test / Server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Keep this deterministic: inherited server tests share SQLite files,
      # temporary repositories, and process-level orchestration state.
      - name: Test server
        working-directory: apps/server
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            vp test run \
              --fileParallelism \
              --maxWorkers=4 \
              --reporter=default \
              --reporter=json \
              --outputFile.json="${{ runner.temp }}/server-tests.json" \
            2>&1 | tee "${{ runner.temp }}/server-tests.log"

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload server test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-diagnostics
          path: |
            ${{ runner.temp }}/server-tests.log
            ${{ runner.temp }}/server-tests.json
          if-no-files-found: warn
          retention-days: 30

  test_web:
    name: Test / Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test web
        working-directory: apps/web
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            vp test run \
              --passWithNoTests \
              --project unit \
              --reporter=default \
              --reporter=json \
              --outputFile.json="${{ runner.temp }}/web-tests.json" \
            2>&1 | tee "${{ runner.temp }}/web-tests.log"

      - name: Upload web test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-diagnostics
          path: |
            ${{ runner.temp }}/web-tests.log
            ${{ runner.temp }}/web-tests.json
          if-no-files-found: warn
          retention-days: 30

  test_workspace:
    name: Test / Workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # The root script recursively runs every package, while the server and
      # web app have dedicated lanes above, so exclude all three to avoid
      # duplicate work.
      - name: Test workspace packages
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            vp run \
              --filter '!t3' \
              --filter '!@t3tools/monorepo' \
              --filter '!@t3tools/web' \
              --fail-if-no-match \
              --verbose \
              --log grouped \
              test \
            2>&1 | tee "${{ runner.temp }}/workspace-tests.log"

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Upload workspace test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-test-diagnostics
          path: ${{ runner.temp }}/workspace-tests.log
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test
    if: always()
    needs:
      - test_server
      - test_web
      - test_workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify test suites
        env:
          SERVER_RESULT: ${{ needs.test_server.result }}
          WEB_RESULT: ${{ needs.test_web.result }}
          WORKSPACE_RESULT: ${{ needs.test_workspace.result }}
        run: |
          test "$SERVER_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$WORKSPACE_RESULT" = "success"

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
