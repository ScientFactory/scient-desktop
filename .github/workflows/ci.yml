name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reuse is an optimization only: an absent/failed probe must run normal CI. A queue entry
  # reuses its PR run, and a main push its queue runs, only for the exact same content and base.
  queue_ci:
    name: Reuse exact CI
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.complete.outputs.reused }}
      source_run_id: ${{ steps.restore.outputs.source_run_id }}
      source_url: ${{ steps.restore.outputs.source_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Verify qualification and restore reports
        id: restore
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/ci-queue-reuse.cjs').restore({ github, context, core });
      - name: Preserve transfer report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/ci-queue-reuse/thread-transfer-result.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Preserve web_1 report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-web-1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/vitest-web-1.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve web_2 report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-web-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/vitest-web-2.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve web_3 report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-web-3-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/vitest-web-3.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve server_1 report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-server-1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/vitest-server-1.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve server_2 report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-server-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/vitest-server-2.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Preserve server_3 report
        if: steps.restore.outputs.candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-server-3-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/vitest-server-3.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      # This is deliberately last: partial publication never suppresses CI.
      - name: Confirm reuse
        if: steps.restore.outputs.candidate == 'true'
        id: complete
        env:
          SOURCE_URL: ${{ steps.restore.outputs.source_url }}
        run: |
          echo "reused=true" >> "$GITHUB_OUTPUT"
          printf 'Reused successful [CI](%s) of this exact content and comparison base. All seven reporting artifacts were preserved.\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Test queue CI reuse and workflow coverage
        run: node --test .github/scripts/ci-queue-reuse.test.cjs

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check generated GitHub GraphQL operations
        run: vp run --filter @t3tools/source-control-github generate --check

      - name: Check
        run: vp check

      - name: Verify Scient product identity
        run: vp run brand:check
      - name: Typecheck
        run: vpr typecheck

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Everything except `t3` (apps/server) and `@t3tools/web`, which have their
  # own sharded jobs below. `--parallel` drops the package dependency ordering
  # that `vp run` applies by default: these `test` tasks declare no `dependsOn`
  # and resolve workspace deps from source, so ordering only bought us idle
  # runners between dependency layers. The concurrency limit stays at the
  # default 4 so peak load per runner is unchanged.
  test_workspaces:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Test Workspaces
    runs-on: ubuntu-24.04
    # Preserve the existing ceiling while measuring the web suite split.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Blacksmith boots GitHub's Ubuntu runner image (gcc is usually present),
      # but ACP process-tree live tests compile a small pthread fixture with `cc`
      # and soft-skip when it is missing. Install build-essential so that path
      # always runs in CI instead of silently no-oping.
      - name: Install C toolchain for process-tree fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          command -v cc

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Verify SVG and PNG exports in Chromium
        run: xvfb-run --auto-servernum node apps/desktop/scripts/svg-export-smoke.mjs

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test
        run: |
          set -o pipefail
          vp run --parallel --concurrency-limit 4 --verbose --log grouped \
            --filter '!t3' --filter '!@t3tools/web' --filter '!@t3tools/monorepo' test \
            2>&1 | tee "${{ runner.temp }}/workspace-tests.log"

  compute_changes:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Compute Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      real_kernel: ${{ steps.detect.outputs.real_kernel }}
      managed_python: ${{ steps.detect.outputs.managed_python }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
      - name: Test qualification gate
        run: node --test .github/scripts/compute-ci-gate.test.mjs
      - name: Detect Compute changes
        id: detect
        run: node .github/scripts/compute-ci-gate.mjs detect

  compute_native:
    needs: [queue_ci, compute_changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.compute_changes.outputs.changed != 'false' }}
    uses: ./.github/workflows/scient-compute-python-kernel.yml
    with:
      real_kernel: ${{ needs.compute_changes.outputs.real_kernel != 'false' }}
      managed_python: ${{ needs.compute_changes.outputs.managed_python != 'false' }}

  windows_packaging_changes:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Windows Packaging Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      linux_changed: ${{ steps.detect.outputs.linux_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
      - name: Test desktop packaging qualification gate
        run: node --test .github/scripts/windows-packaging-ci-gate.test.mjs
      - name: Detect desktop packaging changes
        id: detect
        run: node .github/scripts/windows-packaging-ci-gate.mjs detect

  windows_packaging:
    needs: [queue_ci, windows_packaging_changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.windows_packaging_changes.outputs.changed != 'false' }}
    uses: ./.github/workflows/windows-packaging.yml

  remote_server_packaging:
    needs: [queue_ci, windows_packaging_changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.windows_packaging_changes.outputs.changed != 'false' }}
    uses: ./.github/workflows/remote-server-packaging.yml

  linux_packaging:
    needs: [queue_ci, windows_packaging_changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.windows_packaging_changes.outputs.linux_changed != 'false' }}
    uses: ./.github/workflows/linux-packaging.yml

  # Keep the already-required check name. Native failures must block it, while
  # unrelated PRs may skip native qualification only after a successful diff.
  test:
    name: Test
    needs: [queue_ci, test_workspaces, compute_changes, compute_native, windows_packaging_changes, windows_packaging, remote_server_packaging, linux_packaging]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Report reused qualification
        if: needs.queue_ci.outputs.reused == 'true'
        env:
          SOURCE_URL: ${{ needs.queue_ci.outputs.source_url }}
        run: printf 'Test suites passed in [exact-content CI](%s). Reporting artifacts are attached to this run.\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Require applicable test suites
        if: needs.queue_ci.outputs.reused != 'true'
        env:
          WORKSPACE_RESULT: ${{ needs.test_workspaces.result }}
          DETECTION_RESULT: ${{ needs.compute_changes.result }}
          COMPUTE_CHANGED: ${{ needs.compute_changes.outputs.changed }}
          NATIVE_RESULT: ${{ needs.compute_native.result }}
          WINDOWS_DETECTION_RESULT: ${{ needs.windows_packaging_changes.result }}
          WINDOWS_CHANGED: ${{ needs.windows_packaging_changes.outputs.changed }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows_packaging.result }}
          REMOTE_SERVER_RESULT: ${{ needs.remote_server_packaging.result }}
          LINUX_CHANGED: ${{ needs.windows_packaging_changes.outputs.linux_changed }}
          LINUX_NATIVE_RESULT: ${{ needs.linux_packaging.result }}
        run: |
          node .github/scripts/compute-ci-gate.mjs check
          node .github/scripts/windows-packaging-ci-gate.mjs check

  # Split the web unit suite across runners so it does not compete with
  # other packages in `test`. Measure the speedup in CI; sharding does not
  # replace deterministic synchronization in tests. These unit tests need
  # neither the Electron binary nor libsecret.
  test_web:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Test Web ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # The browser project runs React tests in headless Chromium. Same cache key as
      # test_server, so both jobs share one downloaded browser.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        env:
          TEST_REPORT: ${{ runner.temp }}/vitest-web-${{ matrix.shard }}.json
          # SCIENT-FORK: the Markdown editor timing suite runs in its own step below.
          SCIENT_MARKDOWN_PERF_SHARED_RUNNER: "1"
        run: >-
          vp run --filter @t3tools/web test
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default
          --reporter=json
          --outputFile.json="$TEST_REPORT"

      # SCIENT-FORK:START — the Markdown editor's timing budgets skip in the shard, where they
      # would share the runner with headless Chromium and measure that contention, and run alone.
      - name: Test Markdown editor performance
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: vp run --filter @t3tools/web test src/scient/markdownEditor/prosemirror/performance.test.ts
      # SCIENT-FORK:END

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-web-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-web-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # apps/server sets `fileParallelism: false`, so its test files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # V2 roughly tripled the server suite (957 files). The three shard names
    # are required checks, so they get more time rather than more shards.
    # Shard duration spans 17-25m depending on runner allocation; the cap must
    # clear the slowest allocation or a green shard gets cancelled mid-cleanup.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Seal Compute candidate metadata
        run: node apps/server/scripts/compute-recipes.ts seal

      # Cache the pinned browser and skip apt unless shared libraries are missing.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          TEST_REPORT: ${{ runner.temp }}/vitest-server-${{ matrix.shard }}.json
        run: >-
          vp run --filter t3 test
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default
          --reporter=json
          --outputFile.json="$TEST_REPORT"

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-server-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-server-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # A matrix job skipped as a whole reports one unexpanded name, never `Test Web 1` to `3` or
  # `Test Server 1` to `3`. When a queue entry reuses its PR run, these report the required
  # shard names for the shards that run qualified.
  test_web_reused:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused == 'true' && github.event_name == 'merge_group' }}
    name: Test Web ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Report reused shard
        env:
          SOURCE_URL: ${{ needs.queue_ci.outputs.source_url }}
        run: printf 'This shard passed in [exact-content CI](%s).\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"

  test_server_reused:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused == 'true' && github.event_name == 'merge_group' }}
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Report reused shard
        env:
          SOURCE_URL: ${{ needs.queue_ci.outputs.source_url }}
        run: printf 'This shard passed in [exact-content CI](%s).\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"

  transfer-report:
    name: Transfer report artifact
    needs: [queue_ci, test_server]
    if: ${{ !cancelled() && (needs.queue_ci.outputs.reused == 'true' || needs.test_server.result == 'success') }}
    # On Blacksmith like every other job here: the GitHub-hosted queue is shared
    # with the PR bots and can leave this job waiting until it is abandoned,
    # which fails `Check` on an otherwise green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require transfer measurements
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      # The compute session's Python bridge has no workspace package to run it,
      # so it would otherwise be the one part of that feature no lane covers.
      # These tests fake the kernel manager and the channels, so they need only
      # a standard library and finish in under a second -- the suite that needs
      # a real kernel lives in `scient-compute-python-kernel.yml` instead.
      - name: Test compute session Python bridge
        working-directory: apps/server/src/scient/compute/bridge
        run: python3 -m unittest discover --pattern 'test_*.py' --verbose

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  # The static analysis below needs a macOS runner, which bills ~6.7x a Linux
  # minute, so gate it on the native sources it actually lints instead of paying
  # for it on every push. Detection is API-only (no checkout) and fails open: if
  # the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
      - name: Detect mobile native changes
        id: detect
        env:
          # The same immutable comparison as the other change gates on every event. A PR's live
          # file list can change during a run, and the merge queue reuses this decision.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_open "The comparison base is missing."
          # Without rename detection a rename lists both paths: renaming a matched file
          # out of the matched paths removes a lint input just like editing it. A newline
          # inside a filename becomes `?`, so each path stays on one line for the matcher.
          paths=$(git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" | tr '\n\0' '?\n') \
            || fail_open "Could not resolve changed files."

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: [queue_ci, mobile_native_changes]
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it.
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Verify mobile native static analysis tools
        run: |
          for tool in swiftlint ktlint detekt; do
            command -v "$tool" >/dev/null || {
              echo "Required mobile native static analysis tool is unavailable: $tool" >&2
              exit 1
            }
          done

      - name: Lint mobile native sources
        run: node scripts/mobile-native-static-check.ts

  release_smoke:
    needs: queue_ci
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # Records the exact content and base a fully successful queue run, or same-repository PR run,
  # qualified. Fork PRs never record one, so their queue entries always run normal CI.
  qualification:
    name: Qualification receipt
    needs: [queue_ci, check, test_workspaces, compute_changes, compute_native, windows_packaging_changes, windows_packaging, remote_server_packaging, linux_packaging, test, test_web, test_server, transfer-report, rust, mobile_native_changes, mobile_native_static_analysis, release_smoke]
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Record complete qualification
        id: receipt
        uses: actions/github-script@v8
        env:
          QUALIFICATION_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            return await require('./.github/scripts/ci-queue-reuse.cjs').writeReceipt({
              github, context, core, needs: JSON.parse(process.env.QUALIFICATION_NEEDS),
            });
      - if: steps.receipt.outputs.result == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.event_name == 'merge_group' && 'queue' || 'pr' }}-qualification-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/receipt.json
          if-no-files-found: error
          retention-days: 14
