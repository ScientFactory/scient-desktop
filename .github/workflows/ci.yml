name: CI

on:
  pull_request:
  # SCIENT-FORK:START — native GitHub merge queue.
  merge_group:
    types: [checks_requested]
  # SCIENT-FORK:END
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SCIENT-FORK:START — hosted runners throughout; no paid Blacksmith fleet.
  # Release-note content retains its additional catalog and rendering qualification.
  release_notes:
    name: Release notes qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      qualified: ${{ steps.complete.outputs.qualified }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
      - name: Classify immutable release-note diff
        id: detect
        if: github.event_name != 'push'
        run: node .github/scripts/release-notes-ci-gate.mjs
      - name: Checkout focused test inputs
        if: steps.detect.outputs.only == 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        if: steps.detect.outputs.only == 'true'
        uses: ./.github/actions/setup-ci-deps
      - name: Check release-note formatting and lint
        if: steps.detect.outputs.only == 'true'
        run: |
          vp fmt --check apps/web/src/scient/releaseNotes
          vp lint apps/web/src/scient/releaseNotes --report-unused-disable-directives
      - name: Typecheck web
        if: steps.detect.outputs.only == 'true'
        run: vp run --filter @t3tools/web typecheck
      - name: Install Chromium
        if: steps.detect.outputs.only == 'true'
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Validate catalog and test release-note rendering
        if: steps.detect.outputs.only == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { SCIENT_RELEASE_NOTES } from './apps/web/src/scient/releaseNotes/catalog.ts';
          import { validateScientReleaseNotesCatalog } from './apps/web/src/scient/releaseNotes/model.ts';
          const errors = validateScientReleaseNotesCatalog(SCIENT_RELEASE_NOTES);
          if (errors.length) throw new Error(errors.join('\n'));
          NODE
          vp run --filter @t3tools/web test src/scient/releaseNotes
      - name: Confirm focused qualification
        id: complete
        if: steps.detect.outputs.only == 'true'
        run: |
          echo "qualified=true" >> "$GITHUB_OUTPUT"
          echo 'Release-note content passed catalog validation, web types, formatting, lint, and Chromium rendering tests. Full product suites also run.' >> "$GITHUB_STEP_SUMMARY"

  # Reuse is an optimization only: unavailable evidence runs normal CI. A queue entry
  # reuses its PR run only for the exact same content and base; main always runs fresh.
  queue_ci:
    needs: release_notes
    name: Reuse exact CI
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.complete.outputs.reused }}
      web_reports: ${{ steps.restore.outputs.web_reports }}
      server_reports: ${{ steps.restore.outputs.server_reports }}
      source_run_id: ${{ steps.restore.outputs.source_run_id }}
      source_url: ${{ steps.restore.outputs.source_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions/ci-queue-reporting
      - name: Verify qualification and restore reports
        id: restore
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/ci-queue-reuse.cjs').restore({ github, context, core });
      - name: Preserve applicable reports
        id: preserve
        continue-on-error: true
        if: steps.restore.outputs.candidate == 'true'
        uses: ./.github/actions/ci-queue-reporting
        with:
          web_reports: ${{ steps.restore.outputs.web_reports }}
          server_reports: ${{ steps.restore.outputs.server_reports }}
      # This is deliberately last: partial publication never suppresses CI.
      - name: Confirm reuse
        if: steps.restore.outputs.candidate == 'true' && steps.preserve.outcome == 'success'
        id: complete
        env:
          SOURCE_URL: ${{ steps.restore.outputs.source_url }}
        run: |
          echo "reused=true" >> "$GITHUB_OUTPUT"
          printf 'Reused successful [CI](%s) of this exact content and comparison base. All applicable reporting artifacts were preserved.\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"

  # SCIENT-FORK:END

  # SCIENT-FORK:START — test, build and typecheck lanes always run fresh unless reused.
  # Changes retains upstream ownership for release smoke and exact native gates.
  # Unknown diffs fail open; main runs every lane.
  # SCIENT-FORK:END
  changes:
    needs: [queue_ci, release_notes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.detect.outputs.typecheck }}
      build: ${{ steps.detect.outputs.build }}
      test: ${{ steps.detect.outputs.test }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      test_web: ${{ steps.detect.outputs.test_web }}
      test_server: ${{ steps.detect.outputs.test_server }}
      rust: ${{ steps.detect.outputs.rust }}
      release_smoke: ${{ steps.detect.outputs.release_smoke }}
      mobile_native: ${{ steps.detect.outputs.mobile_native }}
      # SCIENT-FORK:START — native selectors share this immutable-diff checkout.
      compute_changed: ${{ github.event_name == 'push' && 'true' || steps.compute.outputs.changed }}
      real_kernel: ${{ github.event_name == 'push' && 'true' || steps.compute.outputs.real_kernel }}
      managed_python: ${{ github.event_name == 'push' && 'true' || steps.compute.outputs.managed_python }}
      windows_changed: ${{ github.event_name == 'push' && 'true' || steps.packaging.outputs.changed }}
      linux_changed: ${{ github.event_name == 'push' && 'true' || steps.packaging.outputs.linux_changed }}
      # SCIENT-FORK:END
    steps:
      # Only the package manifests the script reads to build the dependency graph.
      # SCIENT-FORK: retain the immutable event base even if main has since advanced.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /pnpm-workspace.yaml
            /.github/scripts/
            /.github/actions/ci-changes/
            /*/package.json
            /*/*/package.json
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: detect
        uses: ./.github/actions/ci-changes

  # SCIENT-FORK:START — preserve packaging/Compute classifiers and their tests.
      # Each gate runs independently after another gate fails. A gate whose
      # tests fail leaves its outputs unknown, retaining fail-open execution.
      - name: Test Compute qualification gate
        id: compute_gate
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/compute-ci-gate.test.mjs
      - name: Detect Compute changes
        id: compute
        if: ${{ !cancelled() && steps.compute_gate.outcome == 'success' }}
        run: node .github/scripts/compute-ci-gate.mjs detect
      - name: Test desktop packaging qualification gate
        id: packaging_gate
        if: ${{ !cancelled() }}
        run: node --test .github/scripts/windows-packaging-ci-gate.test.mjs
      - name: Detect desktop packaging changes
        id: packaging
        if: ${{ !cancelled() && steps.packaging_gate.outcome == 'success' }}
        run: node .github/scripts/windows-packaging-ci-gate.mjs detect
  # SCIENT-FORK:END

  # Lint and the desktop build each get a runner so they run side by side.
  # Typecheck shares the build's install. Lint always runs: it formats every
  # file, docs included. The `Check` job at the end of this file passes only
  # when every other job passes or was skipped by `changes`.
  lint:
    needs: [queue_ci, release_notes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false


      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # SCIENT-FORK:START — exercise the fork gates and reporting contracts.
      - name: Test CI selection and workflow coverage
        run: node --test .github/scripts/*.test.cjs .github/scripts/*.test.mjs
      # SCIENT-FORK:END

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check generated GitHub GraphQL operations
        run: vp run --filter @t3tools/source-control-github generate --check

      - name: Check generated Expo GraphQL operations
        run: vp run --filter t3 generate --check

      - name: Check
        run: vp check

      # SCIENT-FORK:START — product identity stays part of lint qualification.
      - name: Verify Scient product identity
        run: vp run brand:check
      # SCIENT-FORK:END

  build:
    name: Build and Typecheck
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-apt-mirrors

      # Runs in the background while Vite+ installs; the step before the build waits for it.
      - name: Start installing browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          (
            set +e
            sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        id: electron
        run: vp run --filter @t3tools/desktop ensure:electron

      # SCIENT-FORK:START — keep build/typecheck memory within a hosted 4-vCPU runner.
      - name: Typecheck
        run: vpr typecheck
      # SCIENT-FORK:END

      - name: Finish installing browser secret helper build libraries
        id: apt
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Build desktop pipeline
        id: build
        if: ${{ !cancelled() && steps.electron.outcome == 'success' && steps.apt.outcome == 'success' }}
        run: vp run build:desktop

      - name: Verify preload bundle output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node apps/desktop/scripts/verify-preload-bundle.mjs


  test:
    name: Test
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    # SCIENT-FORK:START — retain the measured standard-runner workspace ceiling.
    timeout-minutes: 20
    # SCIENT-FORK:END
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # The Ubuntu runner image usually includes gcc,
      # but ACP process-tree live tests compile a small pthread fixture with `cc`
      # and soft-skip when it is missing. Install build-essential so that path
      # always runs in CI instead of silently no-oping.
      - name: Install C toolchain for process-tree fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          command -v cc

      - uses: ./.github/actions/setup-apt-mirrors

      # The desktop tests compile the browser secret helper. The install runs in
      # the background while Vite+ installs; the step before the tests waits for it.
      - name: Start installing browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          (
            set +e
            sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # SCIENT-FORK:START — verify exports with the actual installed Electron runtime.
      - name: Verify SVG and PNG exports in Chromium
        run: xvfb-run --auto-servernum node apps/desktop/scripts/svg-export-smoke.mjs
      # SCIENT-FORK:END

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs

      - name: Finish installing browser secret helper build libraries
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      # SCIENT-FORK:START — every workspace package with a test task participates.
      - name: Test
        run: >-
          vp run --parallel --concurrency-limit 4
          --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test
      # SCIENT-FORK:END

  # The web suite is the largest outside the server. In the shared Test job it
  # started last and ran alone for about 40s after everything else finished.
  # release.yml mirrors this test, test_web, and test_server split.
  # SCIENT-FORK:START — duration-balanced hosted shards, JSON reports and performance suites.
  test_web:
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Test Web ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # SCIENT-FORK:START — headroom over the slowest web shard (upstream: 10).
    # Retain setup/performance headroom until the balanced split is measured in CI.
    timeout-minutes: 15
    # SCIENT-FORK:END
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # The browser project runs React tests in headless Chromium. Same cache key as
      # test_server, so both jobs share one downloaded browser.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        env:
          TEST_REPORT: ${{ runner.temp }}/vitest-web-${{ matrix.shard }}.json
        run: >-
          vp run --filter @t3tools/web test
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default
          --reporter=json
          --outputFile.json="$TEST_REPORT"

      # Browser tests run source modules; this boots the production chunk graph.
      - name: Boot the built web client
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

      # SCIENT-FORK:START — measure timing budgets separately from parallel correctness tests.
      - name: Test scientific editor performance
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          SCIENT_MARKDOWN_PERF_STRICT: "1"
        run: vp run --filter @t3tools/web test:performance
      # SCIENT-FORK:END

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-web-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-web-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # SCIENT-FORK:END

  # SCIENT-FORK:START — duration-balanced hosted shards, JSON reports and performance suites.
  # apps/server sets `fileParallelism: false`, so its test files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    # The organization allows 60 concurrent jobs; keep the measured eight-way split.
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' }}
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # SCIENT-FORK:START — shard 1 also runs the Python bridge and performance steps (upstream: 10).
    timeout-minutes: 15
    # SCIENT-FORK:END
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Seal Compute candidate metadata
        run: node apps/server/scripts/compute-recipes.ts seal

      # Cache the pinned browser and skip apt unless shared libraries are missing.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          TEST_REPORT: ${{ runner.temp }}/vitest-server-${{ matrix.shard }}.json
        run: >-
          vp run --filter t3 test
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default
          --reporter=json
          --outputFile.json="$TEST_REPORT"

      # SCIENT-FORK:START — retain server measurements outside ordinary correctness tests.
      - name: Test compute session Python bridge
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/server/src/scient/compute/bridge
        run: python3 -m unittest discover --pattern 'test_*.py' --verbose
      - name: Test scientific server performance
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: vp run --filter t3 test:performance
      # SCIENT-FORK:END

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-server-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-server-${{ matrix.shard }}.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # SCIENT-FORK:END

  rust:
    name: Rust
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.mobile_native != 'false' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      # SCIENT-FORK:START — missing analyzers must not turn into successful skips.
      - name: Verify mobile native static analysis tools
        run: |
          for tool in swiftlint ktlint detekt; do
            command -v "$tool" >/dev/null || {
              echo "Required mobile native static analysis tool is unavailable: $tool" >&2
              exit 1
            }
          done

      # SCIENT-FORK:END

      # SCIENT-FORK:START — this job's sparse checkout lacks the workspace packages that
      # `vp run` loads to build its task graph, so call the root `lint:mobile` script directly.
      - name: Lint mobile native sources
        run: node scripts/mobile-native-static-check.ts
      # SCIENT-FORK:END

  release_smoke:
    name: Release Smoke
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.release_smoke != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # SCIENT-FORK:START — Windows Overleaf evidence is mandatory, including exact queue reuse.
  overleaf_windows:
    name: Overleaf Windows
    needs: [release_notes]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'
      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: overleaf-windows-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: vp install
      - name: Set adversarial global Git defaults
        shell: pwsh
        run: |
          git config --global core.autocrlf true
          git config --global core.fileMode true
          git config --global core.longpaths false
          git config --global core.safecrlf true
          git config --global core.attributesFile "$env:RUNNER_TEMP/overleaf-global-attributes"
          Set-Content "$env:RUNNER_TEMP/overleaf-global-attributes" '* text eol=crlf' -Encoding utf8
          git config --global credential.helper '!exit 91'
      - name: Require every Overleaf platform file without skips
        run: node .github/scripts/overleaf-platform-tests.cjs
      # Each case must finish its sync; 300 files is left to the Linux performance lane.
      - name: Time real Overleaf syncs on Windows
        working-directory: apps/server
        run: vp test bench --run --fileParallelism=false --maxWorkers=1 src/scient/overleaf/OverleafSync.bench.ts -t "(incoming|outgoing) (1|10|50)$"
  # SCIENT-FORK:END

  # SCIENT-FORK:START — native qualification stays under the same required gate.
  compute_native:
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.compute_changed != 'false' }}
    uses: ./.github/workflows/scient-compute-python-kernel.yml
    with:
      real_kernel: ${{ needs.changes.outputs.real_kernel != 'false' }}
      managed_python: ${{ needs.changes.outputs.managed_python != 'false' }}

  windows_packaging:
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.windows_changed != 'false' }}
    uses: ./.github/workflows/windows-packaging.yml

  remote_server_packaging:
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.windows_changed != 'false' }}
    uses: ./.github/workflows/remote-server-packaging.yml

  linux_packaging:
    needs: [queue_ci, release_notes, changes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused != 'true' && needs.changes.outputs.linux_changed != 'false' }}
    uses: ./.github/workflows/linux-packaging.yml

  # Only Check is required, so one reporter per reused suite is sufficient.
  test_web_reused:
    needs: [queue_ci, release_notes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused == 'true' && github.event_name == 'merge_group' }}
    name: Test Web (qualified)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report reused qualification
        env:
          SOURCE_URL: ${{ needs.queue_ci.outputs.source_url }}
        run: |
          printf 'All suites passed in [exact-content CI](%s).\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"

  test_server_reused:
    needs: [queue_ci, release_notes]
    if: ${{ !cancelled() && needs.queue_ci.outputs.reused == 'true' && github.event_name == 'merge_group' }}
    name: Test Server (qualified)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report reused qualification
        env:
          SOURCE_URL: ${{ needs.queue_ci.outputs.source_url }}
        run: |
          printf 'All suites passed in [exact-content CI](%s).\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"

  qualification:
    name: Qualification receipt
    needs: [release_notes, queue_ci, changes, lint, build, test, test_web, test_server, overleaf_windows, rust, mobile_native_static_analysis, release_smoke, compute_native, windows_packaging, remote_server_packaging, linux_packaging, test_web_reused, test_server_reused]
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Record complete qualification
        id: receipt
        uses: actions/github-script@v8
        env:
          QUALIFICATION_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            return await require('./.github/scripts/ci-queue-reuse.cjs').writeReceipt({
              github, context, core, needs: JSON.parse(process.env.QUALIFICATION_NEEDS),
            });
      - if: steps.receipt.outputs.result == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.event_name == 'merge_group' && 'queue' || 'pr' }}-qualification-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-queue-reuse/receipt.json
          if-no-files-found: error
          retention-days: 14
  # SCIENT-FORK:END

  # Branch protection requires this job by its name, `Check`. It fails when any
  # other job fails, is cancelled, or is skipped without a reason, so splitting
  # or resharding jobs needs no ruleset change. Add every new job to `needs`.
  # `always()` rather than `!cancelled()`: a skipped job reports success to
  # branch protection, so a cancelled run must still produce a failing check.
  check:
    name: Check
    if: ${{ always() }}
    needs: [release_notes, queue_ci, changes, lint, build, test, test_web, test_server, overleaf_windows, rust, mobile_native_static_analysis, release_smoke, compute_native, windows_packaging, remote_server_packaging, linux_packaging, test_web_reused, test_server_reused, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # SCIENT-FORK:START — validate explicit skip reasons, including reuse and native gates.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          QUALIFYING_PR: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: node .github/scripts/ci-check.cjs

      - name: Require applicable native qualification
        if: needs.queue_ci.outputs.reused != 'true'
        env:
          WORKSPACE_RESULT: ${{ needs.test.result }}
          DETECTION_RESULT: ${{ needs.changes.result }}
          COMPUTE_CHANGED: ${{ needs.changes.outputs.compute_changed }}
          NATIVE_RESULT: ${{ needs.compute_native.result }}
          WINDOWS_DETECTION_RESULT: ${{ needs.changes.result }}
          WINDOWS_CHANGED: ${{ needs.changes.outputs.windows_changed }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows_packaging.result }}
          REMOTE_SERVER_RESULT: ${{ needs.remote_server_packaging.result }}
          LINUX_CHANGED: ${{ needs.changes.outputs.linux_changed }}
          LINUX_NATIVE_RESULT: ${{ needs.linux_packaging.result }}
        run: |
          node .github/scripts/compute-ci-gate.mjs check
          node .github/scripts/windows-packaging-ci-gate.mjs check

      # thread-transfer-report.yml reads this artifact after CI, including restored queue evidence.
      - name: Require transfer measurements
        if: needs.test_server.result == 'success' || needs.queue_ci.outputs.server_reports == 'true'
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer
      # SCIENT-FORK:END
