name: Pi startup Linux diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-ci-deps
      - name: Repeat native Pi tests on four workers
        working-directory: apps/server
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/pi-probe"
          pids=()
          for worker in 1 2 3 4; do
            (
              for attempt in {1..12}; do
                log="$RUNNER_TEMP/pi-probe/$worker-$attempt.log"
                if ! vp test run src/orchestration-v2/PiObservedEffort.native.integration.test.ts > "$log" 2>&1; then
                  echo "worker $worker attempt $attempt failed"
                  cat "$log"
                  exit 1
                fi
                echo "worker $worker attempt $attempt passed"
              done
            ) &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          exit "$result"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-start-diagnostic
          path: ${{ runner.temp }}/pi-probe/*.log
          retention-days: 3
