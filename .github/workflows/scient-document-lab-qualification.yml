# Runs the Document Lab Word job against the real pinned LibreOffice on macOS, Windows and Linux.
# Each runner provisions the same pinned build the dev setup installs (size and digest checked,
# unpacked without a system install), runs the job's unit tests, then the real-engine cases, and
# uploads the PDFs, edited copies and evidence.json for visual review. Fonts come from the
# runner, so evidence differs by platform; the checks compare each source with its own render.
name: Scient Document Lab Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"
  pull_request:
    paths:
      - "apps/server/src/scient/documents/docxJob/**"
      - "apps/server/src/mcp/toolkits/documents/docxTrackedReplace*"
      - "apps/server/src/mcp/toolkits/documents/projectDocumentBuild.ts"
      - "apps/server/src/mcp/McpHttpServer.ts"
      - "apps/server/src/scient/documents/documentExport/**"
      - "apps/server/src/workspace/WorkspaceFileSystem.ts"
      - "scripts/document-lab-office.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/scient-document-lab-qualification.yml"

permissions:
  contents: read

concurrency:
  group: scient-document-lab-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real_office:
    name: Real LibreOffice / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26, macos-26-intel]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/scripts...

      # Libraries the official Linux build loads even when headless.
      - name: Install LibreOffice runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxinerama1 libnss3 libcups2t64 libdbus-1-3 libsm6 libice6 libxrender1 libxext6 \
            libx11-xcb1 libcairo2 libglib2.0-0t64 fontconfig

      - name: Provision the pinned LibreOffice
        id: office
        run: |
          set -euo pipefail
          node scripts/document-lab-office.mjs provision --dest "$RUNNER_TEMP/office" > "$RUNNER_TEMP/office.json"
          cat "$RUNNER_TEMP/office.json"
          soffice="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sofficePath)' "$RUNNER_TEMP/office.json")"
          echo "SCIENT_DOCUMENT_LAB_SOFFICE=$soffice" >> "$GITHUB_ENV"
          echo "SCIENT_DOCUMENT_LAB_EVIDENCE_OUT=$RUNNER_TEMP/document-lab-evidence" >> "$GITHUB_ENV"

      - name: Run the Word job's unit tests
        working-directory: apps/server
        run: |
          vp test run src/scient/documents/docxJob \
            src/mcp/toolkits/documents/docxTrackedReplaceHandler.test.ts \
            --exclude '**/*.integration.test.ts'

      # The suite skips without SCIENT_DOCUMENT_LAB_SOFFICE; a skip must not pass as a run.
      - name: Run the real-engine cases
        if: ${{ !cancelled() && steps.office.outcome == 'success' }}
        working-directory: apps/server
        run: |
          set -euo pipefail
          vp test run src/scient/documents/docxJob/DocxTrackedReplacement.integration.test.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/docx-job.json"
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (r.numPassedTests !== 4 || r.numFailedTests !== 0) { console.error("Expected 4 real-engine cases to pass, got " + r.numPassedTests); process.exit(1); }' "$RUNNER_TEMP/docx-job.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-lab-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/document-lab-evidence
            ${{ runner.temp }}/office.json
          if-no-files-found: warn
          retention-days: 14
