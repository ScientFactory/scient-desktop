name: Linux Packaging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    name: Linux packaging / AppImage and native runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: ./.github/actions/setup-apt-mirrors
      - name: Install native build and headless launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake imagemagick pkg-config libsecret-1-dev libxkbcommon-dev libwayland-dev libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb dbus-x11 desktop-file-utils xdg-utils
      - name: Exercise Linux packaging probe regressions
        run: node --test .github/scripts/linux-packaging-probe.test.mjs
      - name: Build receipt-verified SyncTeX input
        run: |
          node scripts/stage-synctex-runtime.ts --platform linux --arch x64 --output "${{ runner.temp }}/synctex-input" --verbose
          # Reproduce the loose-artifact transport mode without modifying a real download.
          chmod 0644 "${{ runner.temp }}/synctex-input/synctex"
      - name: Build and validate the real AppImage
        env:
          TMPDIR: ${{ runner.temp }}/linux-packaging
        run: |
          mkdir -p "$TMPDIR"
          vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --keep-stage --verbose \
            --output-dir "${{ runner.temp }}/linux-clean" \
            --synctex-runtime "${{ runner.temp }}/synctex-input"
          test "$(stat -c '%a' '${{ runner.temp }}/synctex-input/synctex')" = 644
      - name: Build same-stage compression baseline with duplicate trees restored
        id: baseline
        env:
          STAGE_PARENT: ${{ runner.temp }}/linux-packaging
        run: |
          set -euo pipefail
          # Only scratch build filters change. Sources, native outputs, dependency
          # closure, external resources, version, and encoder are identical.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const roots = fs.readdirSync(process.env.STAGE_PARENT).filter(name => name.startsWith('t3code-desktop-linux-stage-'));
          assert.equal(roots.length, 1);
          const stage = path.join(process.env.STAGE_PARENT, roots[0], 'app');
          const manifest = path.join(stage, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          const filters = new Set(['whisper-runtime', 'resource-monitor', 'synctex-runtime', 'kde-capture', 'hyprland-capture'].flatMap(name => ['!apps/desktop/prod-resources/' + name, '!apps/desktop/prod-resources/' + name + '/**/*']));
          assert.equal(pkg.build.files.filter(file => filters.has(file)).length, 10);
          pkg.build.files = pkg.build.files.filter(file => !filters.has(file));
          const config = path.join(process.env.STAGE_PARENT, 'baseline-config.json');
          pkg.build.directories.output = path.join(process.env.RUNNER_TEMP, 'linux-baseline');
          pkg.build.npmRebuild = false;
          fs.writeFileSync(config, JSON.stringify(pkg.build, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'stage=' + stage + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'config=' + config + '\n');
          NODE
      - name: Package the isolated compression baseline
        run: |
          export npm_config_user_agent="$(node -p "require('./package.json').packageManager.replace('@', '/')")"
          vp exec --filter @t3tools/desktop -- electron-builder \
            --projectDir "${{ steps.baseline.outputs.stage }}" --linux AppImage --x64 --publish never \
            --config "${{ steps.baseline.outputs.config }}"
      - name: Extract both actual AppImages
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/linux-clean-extracted" "${{ runner.temp }}/linux-baseline-extracted"
          (cd "${{ runner.temp }}/linux-clean-extracted" && "${{ runner.temp }}"/linux-clean/*.AppImage --appimage-extract > /dev/null)
          (cd "${{ runner.temp }}/linux-baseline-extracted" && "${{ runner.temp }}"/linux-baseline/*.AppImage --appimage-extract > /dev/null)
      - name: Qualify extracted package, native helpers and registration; measure compressed saving
        env:
          QUALIFICATION_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          dbus-run-session -- xvfb-run --auto-servernum node scripts/qualify-linux-packaged-runtime.mjs \
            "${{ runner.temp }}"/linux-clean/*.AppImage \
            "${{ runner.temp }}/linux-clean-extracted/squashfs-root" \
            "${{ runner.temp }}/linux-clean/qualification.json" \
            "${{ runner.temp }}"/linux-baseline/*.AppImage \
            "${{ runner.temp }}/linux-baseline-extracted/squashfs-root"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-packaging-qualification
          path: |
            ${{ runner.temp }}/linux-clean/*.AppImage
            ${{ runner.temp }}/linux-clean/*.yml
            ${{ runner.temp }}/linux-clean/qualification.json*
          if-no-files-found: warn
          retention-days: 7
