name: Remote Server Packaging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Remote server / Linux tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Expose pinned pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - name: Build and pack the real server
        run: |
          vp run --filter t3 build
          node scripts/package-scient-server.ts --version 0.6.22 --output-dir release-server
      - name: Qualify isolated Linux install
        run: node scripts/qualify-scient-server.mjs release-server/scient-server-0.6.22.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: remote-server-qualification
          path: release-server/*.tgz
          if-no-files-found: error
  target_install:
    name: Remote server / ${{ matrix.os }} install
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: remote-server-qualification
          path: release-server
      - name: Qualify exact Linux-produced tarball on target host
        run: node scripts/qualify-scient-server.mjs release-server/scient-server-0.6.22.tgz
