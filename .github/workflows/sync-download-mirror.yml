# Publishes a desktop release to the update feeds at downloads.scientfactory.com right away.
# release.yml dispatches it after a Stable or Beta release is public; it can also be run by hand.
# The website's mirror worker does the copying (POST /sync); this workflow starts it and waits
# until all three of the channel's feed manifests offer the release. Without the secrets, or if
# the mirror cannot finish in time, it only warns: the mirror's own schedule (every ten minutes)
# publishes the release anyway.
name: Sync download mirror

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [stable, beta]
      tag:
        description: Release tag, such as v0.6.32 or v0.6.32-beta.20261121.1
        required: true
        type: string

permissions: {}

jobs:
  # Only a tag that names a release on its channel reaches the sync job's concurrency group, so a
  # mistyped dispatch (GitHub compares group names without case) cannot cancel a running sync.
  validate:
    name: Check the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]{8}\.[1-9][0-9]*$'
          else
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          [[ "$RELEASE_TAG" =~ $pattern ]] || {
            echo "::error::$RELEASE_TAG is not a $RELEASE_CHANNEL release tag."
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  sync:
    name: Publish ${{ needs.validate.outputs.tag }} to the ${{ inputs.channel }} update feeds
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Only a repeat dispatch for the same release replaces its run. Concurrent runs are safe for
    # the mirror.
    concurrency:
      group: sync-download-mirror-${{ inputs.channel }}-${{ needs.validate.outputs.tag }}
      cancel-in-progress: true
    steps:
      - name: Run the mirror and wait for the update feeds
        shell: bash
        env:
          SYNC_URL: ${{ secrets.RELEASE_MIRROR_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.RELEASE_MIRROR_SYNC_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            manifests=(beta.yml beta-mac.yml beta-linux.yml)
          else
            manifests=(latest.yml latest-mac.yml latest-linux.yml)
          fi
          feed="https://downloads.scientfactory.com/scient-desktop/updates/$RELEASE_CHANNEL"
          # One deadline for every check and call, inside the job's timeout. A request runs only
          # with a positive budget read from a single clock reading: curl treats 0 as no limit.
          deadline=$((SECONDS + 20 * 60))
          feeds_offer_release() {
            local manifest offered budget
            for manifest in "${manifests[@]}"; do
              budget=$((deadline - SECONDS))
              (( budget > 30 )) && budget=30
              (( budget > 0 )) || return 1
              offered="$(curl -fsS --max-time "$budget" "$feed/$manifest?noCache=$RANDOM" \
                | sed -nE "s/^version: *['\"]?([^'\"]*)['\"]?\$/\\1/p")" || return 1
              [[ "$offered" == "$version" ]] || return 1
            done
          }
          if feeds_offer_release; then
            echo "The $RELEASE_CHANNEL update feeds already offer $version."
            exit 0
          fi
          if [[ -z "$SYNC_URL" || -z "$SYNC_TOKEN" ]]; then
            echo "::notice::The mirror trigger is not configured; its next scheduled run publishes $version."
            exit 0
          fi
          # GitHub can take a minute to list a new release everywhere the mirror reads, so a run
          # that publishes nothing is repeated. Each call leaves 90 s for the feed check after it.
          attempt=0
          while true; do
            budget=$((deadline - SECONDS - 90))
            (( budget > 600 )) && budget=600
            (( budget >= 30 )) || break
            attempt=$((attempt + 1))
            echo "Mirror run $attempt for $RELEASE_TAG (up to ${budget}s)"
            curl -sS -N --fail-with-body --max-time "$budget" -X POST \
              -H "Authorization: Bearer $SYNC_TOKEN" "$SYNC_URL?channel=$RELEASE_CHANNEL" \
              | grep -v '"Release mirror working"' \
              || echo "::warning::Mirror run $attempt did not finish."
            if feeds_offer_release; then
              echo "The $RELEASE_CHANNEL update feeds offer $version."
              exit 0
            fi
            (( deadline - SECONDS > 60 + 90 + 30 )) || break
            sleep 60
          done
          echo "::warning::The $RELEASE_CHANNEL update feeds do not offer $version yet; the mirror's schedule publishes it."
