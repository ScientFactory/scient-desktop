name: Windows Packaging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux_runtime:
    name: Windows packaging / Linux prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
      - name: Build Linux x64 node-pty and SyncTeX for WSL
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp@12.3.0 rebuild )
          mkdir -p windows-prerequisites/wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" windows-prerequisites/wsl-prebuild/pty.node
          node scripts/stage-synctex-runtime.ts --platform linux --arch x64 --output windows-prerequisites/synctex-wsl --verbose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packaging-prerequisites
          path: windows-prerequisites/
          if-no-files-found: error

  # Starts beside linux_runtime and waits for its artifact only before the build needs it.
  package_windows:
    name: Windows packaging / Installer and native runtime
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      # The runner's C: drive is slow for many small files; its D: drive, which holds the
      # workspace, is several times faster. Temporary files (build stages, Python
      # environments, extracted archives) go there.
      - name: Use the D drive for temporary files
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Caches here are saved only by pushes to main and read by every run. A pull request
      # saving its own copies fills the repository's 10 GB cache and evicts main's.
      # T3's build check needs the Spectre libraries folder of the latest MSVC toolset, so
      # that folder is cached by toolset version; the installer runs only without it.
      - name: Locate the MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installPath) { throw "Visual Studio C++ tools are unavailable" }
          $toolset = Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "install_path=$installPath" >> $env:GITHUB_OUTPUT
          "spectre=$(Join-Path $toolset.FullName 'lib\spectre')" >> $env:GITHUB_OUTPUT
          "toolset=$($toolset.Name)" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Spectre-mitigated MSVC libraries
        id: spectre_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.msvc.outputs.spectre }}
          key: msvc-spectre-v1-${{ steps.msvc.outputs.toolset }}
      # The Visual Studio Installer takes minutes and needs nothing from the checkout, so it
      # runs while the job checks out and installs; the compiler step waits for it.
      - name: Start installing Spectre-mitigated MSVC libraries
        if: ${{ steps.spectre_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        env:
          INSTALL_PATH: ${{ steps.msvc.outputs.install_path }}
        run: |
          $installPath = $env:INSTALL_PATH
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $status = Join-Path $env:RUNNER_TEMP 'spectre-status'
          $script = Join-Path $env:RUNNER_TEMP 'spectre-install.ps1'
          @"
          `$code = 1
          try {
            `$process = Start-Process -FilePath '$setupExe' -ArgumentList 'modify', '--installPath', '"$installPath"', '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart' -Wait -PassThru -NoNewWindow
            if (`$null -ne `$process) { `$code = `$process.ExitCode }
          } finally {
            Set-Content -LiteralPath '$status.partial' -Value `$code
            Move-Item -LiteralPath '$status.partial' -Destination '$status' -Force
          }
          "@ | Set-Content -LiteralPath $script
          Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', $script -WindowStyle Hidden
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'
      - name: Restore packages
        id: package_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-packaging-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Finish installing Spectre-mitigated MSVC libraries
        if: ${{ steps.spectre_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'spectre-status'
          while (!(Test-Path -LiteralPath $status)) { Start-Sleep -Seconds 2 }
          $code = (Get-Content -LiteralPath $status -Raw).Trim()
          if ($code -ne '0') { throw "Visual Studio Installer failed with exit code $code" }
      - name: Initialize the MSVC compiler environment
        shell: pwsh
        env:
          INSTALL_PATH: ${{ steps.msvc.outputs.install_path }}
          SPECTRE: ${{ steps.msvc.outputs.spectre }}
        run: |
          if (!(Test-Path -LiteralPath (Join-Path $env:SPECTRE 'x64'))) { throw "Spectre-mitigated x64 libraries are missing" }
          & "$env:INSTALL_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe -ErrorAction Stop | Out-Null
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (!$value) { throw "Missing compiler environment variable: $name" }
            "$name=$value" >> $env:GITHUB_ENV
          }
      # The pinned whisper.cpp and SyncTeX builds, by the scripts that pin their sources and on
      # this runner image's compiler. The build verifies each receipt before staging it.
      - name: Restore native runtimes
        id: native_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native-runtimes
          key: windows-native-runtimes-v1-${{ steps.msvc.outputs.image }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('scripts/stage-whisper-runtime.ts', 'scripts/stage-synctex-runtime.ts') }}
      # Each script runs in the shell the build gives it: whisper.cpp extracts with Git Bash's
      # GNU tar (--force-local), SyncTeX with Windows tar, which takes C: paths.
      - name: Build the voice runtime
        if: ${{ steps.native_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: node scripts/stage-whisper-runtime.ts --platform win --arch x64 --output native-runtimes/whisper-runtime --verbose
      - name: Build the SyncTeX runtime
        if: ${{ steps.native_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: node scripts/stage-synctex-runtime.ts --platform win --arch x64 --output native-runtimes/synctex-runtime --verbose

      - name: Wait for the Linux prerequisites
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifacts="repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?name=windows-packaging-prerequisites"
          jobs="repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100"
          until [ "$(gh api "$artifacts" --jq '.total_count')" -gt 0 ]; do
            failed=$(gh api "$jobs" --jq '[.jobs[] | select((.name | endswith("Windows packaging / Linux prerequisites")) and .status == "completed" and .conclusion != "success")] | length')
            if [ "$failed" -gt 0 ]; then echo "Windows packaging / Linux prerequisites failed." >&2; exit 1; fi
            sleep 5
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-packaging-prerequisites
          path: windows-prerequisites
      # electron-builder downloads Electron and its NSIS tools on every run without these.
      - name: Restore Electron downloads
        id: electron_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-downloads-v1-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json', 'node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/package.json') }}
      - name: Align qualification package versions
        run: node scripts/update-release-package-versions.ts 0.6.22
      # Fixed qualification version exercises Scient's stable packaging shape.
      # This is the release packer, with no signing secrets or publication step.
      - name: Build and validate the real NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version 0.6.22 --keep-stage --verbose \
            --synctex-runtime "$GITHUB_WORKSPACE/native-runtimes/synctex-runtime" \
            --voice-runtime "$GITHUB_WORKSPACE/native-runtimes/whisper-runtime" \
            --wsl-prebuild "$GITHUB_WORKSPACE/windows-prerequisites/wsl-prebuild/pty.node" \
            --wsl-synctex-runtime "$GITHUB_WORKSPACE/windows-prerequisites/synctex-wsl"
      - name: Exercise packaged terminal and Cursor helpers
        shell: pwsh
        run: |
          $stage = Get-ChildItem $env:TEMP -Directory -Filter 't3code-desktop-win-stage-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $stage) { throw 'Missing retained package stage' }
          node scripts/qualify-windows-packaged-runtime.mjs "$($stage.FullName)/app/dist/win-unpacked"
      - name: Install 0.6.21 and upgrade to the candidate
        shell: pwsh
        run: |
          # The progress display slows Invoke-WebRequest's download several times over.
          $ProgressPreference = 'SilentlyContinue'
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'Scient-0.6.21-x64.exe'
          Invoke-WebRequest 'https://github.com/ScientFactory/scient-desktop/releases/download/v0.6.21/Scient-0.6.21-x64.exe' -OutFile $oldInstaller
          $expectedDigest = '173891f53b4d03c15fd9e551a0bb298fc9cac5ed128176cdd9f5ceb0e6a0a409'
          if ((Get-FileHash $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedDigest) { throw 'Stable installer checksum mismatch' }
          $installDir = Join-Path $env:LOCALAPPDATA 'scient-install-upgrade'
          "SCIENT_PACKAGING_INSTALL=$installDir" >> $env:GITHUB_ENV
          $env:SCIENT_NEXT_HOME = Join-Path $env:RUNNER_TEMP 'scient-upgrade-profile'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'scient-upgrade-appdata'
          foreach ($version in @('0.6.21', '0.6.22')) {
            $installer = if ($version -eq '0.6.21') { $oldInstaller } else { (Resolve-Path 'release/Scient-0.6.22-x64.exe').Path }
            $process = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed for $version with exit $($process.ExitCode)" }
            $exe = Join-Path $installDir 'Scient.exe'
            if (!(Test-Path $exe)) { throw 'Installed executable missing' }
            # electron-builder writes the Windows product version with a fourth
            # revision component, including for the published 0.6.21 installer.
            $installedVersion = (Get-Item $exe).VersionInfo.ProductVersion
            Write-Host "Installed Windows product version: $installedVersion"
            if ($installedVersion -ne "$version.0") { throw "Installed version $installedVersion is not $version.0" }
          }
          node scripts/qualify-windows-packaged-runtime.mjs "$installDir" --launch-smoke
      # The voice helper must need nothing Windows lacks (no Visual C++
      # Redistributable) and must transcribe through the app's runtime owner.
      - name: Transcribe with the installed voice runtime
        shell: pwsh
        run: node scripts/qualify-whisper-runtime.mjs (Join-Path $env:SCIENT_PACKAGING_INSTALL 'resources/whisper-runtime')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-voice-runtime
          path: ${{ env.SCIENT_PACKAGING_INSTALL }}/resources/whisper-runtime/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-packaging-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 7
      - name: Collect the packaged WSL runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path wsl-qualification | Out-Null
          Copy-Item (Join-Path $env:SCIENT_PACKAGING_INSTALL 'resources/wsl-runtime.tar.gz') wsl-qualification/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packaging-wsl-runtime
          path: wsl-qualification/wsl-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Save packages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: ${{ steps.package_cache.outputs.cache-primary-key }}
      - name: Save Spectre-mitigated MSVC libraries
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.spectre_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.msvc.outputs.spectre }}
          key: ${{ steps.spectre_cache.outputs.cache-primary-key }}
      - name: Save native runtimes
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native-runtimes
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Save Electron downloads
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.electron_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ steps.electron_cache.outputs.cache-primary-key }}

  qualify_wsl_runtime:
    name: Windows packaging / Packaged WSL Linux runtime
    needs: package_windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-packaging-wsl-runtime
          path: wsl-qualification
      - name: Exercise the exact Linux payload from the Windows package
        run: node scripts/qualify-wsl-runtime.mjs wsl-qualification/wsl-runtime.tar.gz
