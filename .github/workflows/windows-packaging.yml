name: Windows Packaging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux_runtime:
    name: Windows packaging / Linux prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
      - name: Build Linux x64 node-pty and SyncTeX for WSL
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp@12.3.0 rebuild )
          mkdir -p windows-prerequisites/wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" windows-prerequisites/wsl-prebuild/pty.node
          node scripts/stage-synctex-runtime.ts --platform linux --arch x64 --output windows-prerequisites/synctex-wsl --verbose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packaging-prerequisites
          path: windows-prerequisites/
          if-no-files-found: error

  # Starts beside linux_runtime and waits for its artifact only before the build needs it.
  package_windows:
    name: Windows packaging / Installer and native runtime
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    # The exact WSL payload this execution uploaded, for qualify_wsl_runtime. The first step and
    # the step after a successful upload both record the attempt, so a payload that an earlier
    # attempt of this job reported, or an upload that failed, never matches.
    outputs:
      started_attempt: ${{ steps.execution.outputs.attempt }}
      wsl_attempt: ${{ steps.wsl_uploaded.outputs.attempt }}
      wsl_artifact_id: ${{ steps.wsl_uploaded.outputs.artifact_id }}
      wsl_sha256: ${{ steps.wsl_uploaded.outputs.sha256 }}
      wsl_install_script_sha256: ${{ steps.wsl_uploaded.outputs.install_script_sha256 }}
    steps:
      - name: Record this execution's attempt
        id: execution
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      # The runner's C: drive is slow for many small files; its D: drive, which holds the
      # workspace, is several times faster. Temporary files (build stages, Python
      # environments, extracted archives) go there.
      - name: Use the D drive for temporary files
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Caches here are saved only by pushes to main and read by every run. A pull request
      # saving its own copies fills the repository's 10 GB cache and evicts main's.
      # T3's build check needs the Spectre libraries folder of the latest MSVC toolset, so
      # that folder is cached by toolset version; the installer runs only without it.
      - name: Locate the MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installPath) { throw "Visual Studio C++ tools are unavailable" }
          $toolset = Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "install_path=$installPath" >> $env:GITHUB_OUTPUT
          "spectre=$(Join-Path $toolset.FullName 'lib\spectre')" >> $env:GITHUB_OUTPUT
          "toolset=$($toolset.Name)" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Spectre-mitigated MSVC libraries
        id: spectre_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.msvc.outputs.spectre }}
          key: msvc-spectre-v1-${{ steps.msvc.outputs.toolset }}
      # The Visual Studio Installer takes minutes and needs nothing from the checkout, so it
      # runs while the job checks out and installs; the compiler step waits for it.
      - name: Start installing Spectre-mitigated MSVC libraries
        if: ${{ steps.spectre_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        env:
          INSTALL_PATH: ${{ steps.msvc.outputs.install_path }}
        run: |
          $installPath = $env:INSTALL_PATH
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $status = Join-Path $env:RUNNER_TEMP 'spectre-status'
          $script = Join-Path $env:RUNNER_TEMP 'spectre-install.ps1'
          @"
          `$code = 1
          try {
            `$process = Start-Process -FilePath '$setupExe' -ArgumentList 'modify', '--installPath', '"$installPath"', '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre', '--quiet', '--norestart' -Wait -PassThru -NoNewWindow
            if (`$null -ne `$process) { `$code = `$process.ExitCode }
          } finally {
            Set-Content -LiteralPath '$status.partial' -Value `$code
            Move-Item -LiteralPath '$status.partial' -Destination '$status' -Force
          }
          "@ | Set-Content -LiteralPath $script
          Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', $script -WindowStyle Hidden
      # SCIENT-FORK:START — the published 0.6.21 downloads, verifies and installs while the
      # candidate builds; "Finish installing 0.6.21" waits for it, within a limit, and the
      # upgrade step then installs the candidate over it.
      - name: Start installing 0.6.21 for the upgrade
        shell: pwsh
        run: |
          # A folder other users may change (C:\ passes that on to new folders), under a root
          # they cannot replace: the installer must protect it, or the helper refuses itself.
          $installDir = Join-Path "$env:SystemDrive\" 'scient-install-upgrade'
          "SCIENT_PACKAGING_INSTALL=$installDir" >> $env:GITHUB_ENV
          $status = Join-Path $env:RUNNER_TEMP 'stable-install-status'
          $log = Join-Path $env:RUNNER_TEMP 'stable-install.log'
          $script = Join-Path $env:RUNNER_TEMP 'stable-install.ps1'
          @"
          `$code = 1
          # Each stage is logged as it starts, so a stage that never ends names itself.
          function Write-Stage([string] `$text) { Add-Content -LiteralPath '$log' -Value "`$([DateTime]::UtcNow.ToString('HH:mm:ss')) `$text" }
          try {
            `$ErrorActionPreference = 'Stop'
            # The progress display slows Invoke-WebRequest's download several times over.
            `$ProgressPreference = 'SilentlyContinue'
            `$oldInstaller = Join-Path '$env:RUNNER_TEMP' 'Scient-0.6.21-x64.exe'
            Write-Stage 'Downloading the 0.6.21 installer'
            # A connection that does not open in 30 s, or a download that stops for 60 s, fails.
            Invoke-WebRequest 'https://github.com/ScientFactory/scient-desktop/releases/download/v0.6.21/Scient-0.6.21-x64.exe' -OutFile `$oldInstaller -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60
            Write-Stage "Checking the SHA-256 of the `$((Get-Item -LiteralPath `$oldInstaller).Length) bytes downloaded"
            `$expectedDigest = '173891f53b4d03c15fd9e551a0bb298fc9cac5ed128176cdd9f5ceb0e6a0a409'
            if ((Get-FileHash `$oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne `$expectedDigest) { throw 'Stable installer checksum mismatch' }
            `$env:SCIENT_NEXT_HOME = Join-Path '$env:RUNNER_TEMP' 'scient-upgrade-profile'
            `$env:APPDATA = Join-Path '$env:RUNNER_TEMP' 'scient-upgrade-appdata'
            Write-Stage 'Running the 0.6.21 installer'
            `$process = Start-Process `$oldInstaller -ArgumentList '/S', '/D=$installDir' -Wait -PassThru
            Write-Stage "The 0.6.21 installer exited `$(`$process.ExitCode)"
            if (`$process.ExitCode -ne 0) { throw "Installer failed for 0.6.21 with exit `$(`$process.ExitCode)" }
            `$exe = Join-Path '$installDir' 'Scient.exe'
            if (!(Test-Path `$exe)) { throw 'Installed executable missing' }
            # electron-builder writes the Windows product version with a fourth
            # revision component, including for the published 0.6.21 installer.
            `$installedVersion = (Get-Item `$exe).VersionInfo.ProductVersion
            Add-Content -LiteralPath '$log' -Value "Installed Windows product version: `$installedVersion"
            if (`$installedVersion -ne '0.6.21.0') { throw "Installed version `$installedVersion is not 0.6.21.0" }
            `$code = 0
          } catch {
            Add-Content -LiteralPath '$log' -Value (`$_ | Out-String)
          } finally {
            Set-Content -LiteralPath '$status.partial' -Value `$code
            Move-Item -LiteralPath '$status.partial' -Destination '$status' -Force
          }
          "@ | Set-Content -LiteralPath $script
          # For the bounded wait in "Finish installing 0.6.21".
          "SCIENT_STABLE_INSTALL_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          $background = Start-Process -FilePath pwsh -ArgumentList '-NoProfile', '-File', $script -WindowStyle Hidden -PassThru
          "SCIENT_STABLE_INSTALL_PID=$($background.Id)" >> $env:GITHUB_ENV
      # SCIENT-FORK:END
      # Already one commit, no tags, LFS or submodules; the build reads only HEAD's hash. The
      # checkout's time is mostly the download of each checked-out file, so it leaves out what
      # nothing here reads: reference repositories, test files (no build input imports one),
      # and the mobile app's source and native folders (mobile is not installed; its
      # manifests and tarballs stay for pnpm). That is 9.4k of 40k files and 170 of 500 MB.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/src/
            !/apps/mobile/modules/*/android/
            !/apps/mobile/modules/*/ios/
            !/apps/mobile/modules/*/Vendor/
            !/apps/mobile/modules/*/tests/
            !*.test.*
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      # No dependency store: restoring the whole-workspace store and installing from it took
      # longer than this filtered install without it.
      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      # As release.yml does: the resource monitor binary, by its sources, reused when present.
      - name: Restore the resource monitor
        id: resource_monitor_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/scient-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      # Only the resource monitor needs Rust; a reused binary needs no toolchain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ steps.resource_monitor_cache.outputs.cache-hit != 'true' }}
        with:
          targets: x86_64-pc-windows-msvc
      - name: Finish installing Spectre-mitigated MSVC libraries
        if: ${{ steps.spectre_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'spectre-status'
          while (!(Test-Path -LiteralPath $status)) { Start-Sleep -Seconds 2 }
          $code = (Get-Content -LiteralPath $status -Raw).Trim()
          if ($code -ne '0') { throw "Visual Studio Installer failed with exit code $code" }
      - name: Initialize the MSVC compiler environment
        shell: pwsh
        env:
          INSTALL_PATH: ${{ steps.msvc.outputs.install_path }}
          SPECTRE: ${{ steps.msvc.outputs.spectre }}
        run: |
          if (!(Test-Path -LiteralPath (Join-Path $env:SPECTRE 'x64'))) { throw "Spectre-mitigated x64 libraries are missing" }
          & "$env:INSTALL_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-Command cl.exe -ErrorAction Stop | Out-Null
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (!$value) { throw "Missing compiler environment variable: $name" }
            "$name=$value" >> $env:GITHUB_ENV
          }
      # The pinned SyncTeX build, by the scripts that pin their sources and on
      # this runner image's compiler. The build verifies each receipt before staging it.
      - name: Restore native runtimes
        id: native_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native-runtimes
          key: windows-native-runtimes-v1-${{ steps.msvc.outputs.image }}-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('scripts/stage-synctex-runtime.ts') }}
      - name: Build the SyncTeX runtime
        if: ${{ steps.native_cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: node scripts/stage-synctex-runtime.ts --platform win --arch x64 --output native-runtimes/synctex-runtime --verbose

      - name: Wait for the Linux prerequisites
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-job.sh "Windows packaging / Linux prerequisites" windows-packaging-prerequisites
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-packaging-prerequisites
          path: windows-prerequisites
      # electron-builder downloads Electron and its NSIS tools on every run without these.
      - name: Restore Electron downloads
        id: electron_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-downloads-v1-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json', 'node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/package.json') }}
      - name: Align qualification package versions
        run: node scripts/update-release-package-versions.ts 0.6.22
      # Fixed qualification version exercises Scient's stable packaging shape.
      # This is the release packer, with no signing secrets or publication step.
      - name: Build and validate the real NSIS installer
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version 0.6.22 --keep-stage --verbose \
            --synctex-runtime "$GITHUB_WORKSPACE/native-runtimes/synctex-runtime" \
            --wsl-prebuild "$GITHUB_WORKSPACE/windows-prerequisites/wsl-prebuild/pty.node" \
            --wsl-synctex-runtime "$GITHUB_WORKSPACE/windows-prerequisites/synctex-wsl"
      # The Linux runtime the installer carries, for the WSL qualification after this job;
      # the installed copy must match it byte for byte below.
      - name: Collect the packaged WSL runtime
        id: wsl_collect
        shell: pwsh
        run: |
          $stage = Get-ChildItem $env:TEMP -Directory -Filter 't3code-desktop-win-stage-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $stage) { throw 'Missing retained package stage' }
          $unpacked = Join-Path $stage.FullName 'app/dist/win-unpacked'
          "SCIENT_PACKAGING_UNPACKED=$unpacked" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path wsl-qualification | Out-Null
          Copy-Item (Join-Path $unpacked 'resources/wsl-runtime.tar.gz') wsl-qualification/
          $sha256 = (Get-FileHash wsl-qualification/wsl-runtime.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
      # Production's install script for that tarball, generated here because this job has the
      # workspace; the Linux verifier then needs only Node and its probe.
      - name: Write the WSL install script for the qualification
        id: wsl_install_script
        shell: bash
        env:
          SHA256: ${{ steps.wsl_collect.outputs.sha256 }}
        run: |
          set -euo pipefail
          script_sha256="$(node scripts/write-scient-wsl-install-script.mjs wsl-qualification/wsl-runtime.tar.gz "$SHA256" "$GITHUB_RUN_ATTEMPT")"
          echo "sha256=$script_sha256" >> "$GITHUB_OUTPUT"
      - id: wsl_payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packaging-wsl-runtime
          path: |
            wsl-qualification/wsl-runtime.tar.gz
            wsl-qualification/wsl-runtime-install.sh
            wsl-qualification/wsl-runtime-install.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record the uploaded WSL payload
        id: wsl_uploaded
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.wsl_payload.outputs.artifact-id }}
          SHA256: ${{ steps.wsl_collect.outputs.sha256 }}
          INSTALL_SCRIPT_SHA256: ${{ steps.wsl_install_script.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$SHA256" =~ ^[0-9a-f]{64}$ && "$INSTALL_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'attempt=%s\nartifact_id=%s\nsha256=%s\ninstall_script_sha256=%s\n' "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$SHA256" "$INSTALL_SCRIPT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Exercise packaged terminal and Cursor helpers
        shell: pwsh
        run: node scripts/qualify-windows-packaged-runtime.mjs "$env:SCIENT_PACKAGING_UNPACKED"
      - name: Cache verified speech probe inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scient-speech-probe
          key: speech-probe-v1-${{ hashFiles('apps/server/src/speech/catalog.json', 'apps/server/src/speech-packaging-probe.ts') }}
      # A bound on waiting for the background install, not a time limit on the install: it is
      # normally done before this step begins, and a result it has written is accepted whenever
      # it finished. If there is still no result 10 minutes after it started, or its process is
      # gone without one, this fails with the stage it reached and what it was running. No retry.
      - name: Finish installing 0.6.21
        shell: pwsh
        timeout-minutes: 11
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'stable-install-status'
          $log = Join-Path $env:RUNNER_TEMP 'stable-install.log'
          $started = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:SCIENT_STABLE_INSTALL_STARTED)
          $deadline = $started.AddMinutes(10)
          $background = [int]$env:SCIENT_STABLE_INSTALL_PID
          $failure = $null
          while (!(Test-Path -LiteralPath $status)) {
            if ($null -eq (Get-Process -Id $background -ErrorAction SilentlyContinue)) {
              # It may have written its result just before it exited.
              if (!(Test-Path -LiteralPath $status)) { $failure = 'The 0.6.21 install ended without a result' }
              break
            }
            if ([DateTimeOffset]::UtcNow -gt $deadline) { $failure = 'The 0.6.21 install did not finish within 10 minutes of starting'; break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($failure) {
            $stage = if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | Select-Object -Last 1 } else { 'none logged' }
            Write-Host "Started $($started.ToString('HH:mm:ss')) UTC; now $([DateTime]::UtcNow.ToString('HH:mm:ss')) UTC."
            $oldInstaller = Join-Path $env:RUNNER_TEMP 'Scient-0.6.21-x64.exe'
            if (Test-Path -LiteralPath $oldInstaller) { Write-Host "Installer bytes on disk: $((Get-Item -LiteralPath $oldInstaller).Length) of 316376200." }
            if (Test-Path -LiteralPath $env:SCIENT_PACKAGING_INSTALL) {
              Write-Host "Install folder items: $(@(Get-ChildItem -LiteralPath $env:SCIENT_PACKAGING_INSTALL -Recurse -Force -ErrorAction SilentlyContinue).Count)."
            }
            # What the background install was still running: its process and every descendant.
            $processes = @(Get-CimInstance Win32_Process)
            $tree = [System.Collections.Generic.List[uint32]]::new()
            $tree.Add($background)
            for ($i = 0; $i -lt $tree.Count; $i++) {
              foreach ($child in $processes | Where-Object { $_.ParentProcessId -eq $tree[$i] -and !$tree.Contains($_.ProcessId) }) { $tree.Add($child.ProcessId) }
            }
            $processes | Where-Object { $tree.Contains($_.ProcessId) } |
              Format-Table ProcessId, ParentProcessId, Name, CreationDate, CommandLine -AutoSize -Wrap | Out-String -Width 300 | Write-Host
            throw "$failure; last stage: $stage"
          }
          $code = (Get-Content -LiteralPath $status -Raw).Trim()
          if ($code -ne '0') { throw "Installing 0.6.21 failed" }
      - name: Install 0.6.21 and upgrade to the candidate
        shell: pwsh
        timeout-minutes: 10
        env:
          SCIENT_SPEECH_PROBE_CACHE: ${{ runner.temp }}/scient-speech-probe
        run: |
          $installDir = $env:SCIENT_PACKAGING_INSTALL
          $env:SCIENT_NEXT_HOME = Join-Path $env:RUNNER_TEMP 'scient-upgrade-profile'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'scient-upgrade-appdata'
          $installer = (Resolve-Path 'release/Scient-0.6.22-x64.exe').Path
          # pwsh fails the step only on the last command's exit code; check each probe.
          node scripts/qualify-windows-install-folder.mjs writable "$installDir"
          if ($LASTEXITCODE -ne 0) { throw 'The upgrade fixture is not open to Users' }
          $folderId = node scripts/qualify-windows-install-folder.mjs identity "$installDir"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the install folder identity' }
          # No /D=: like an app update, the installer finds the registered install itself.
          $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed for 0.6.22 with exit $($process.ExitCode)" }
          $exe = Join-Path $installDir 'Scient.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $installedVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed Windows product version: $installedVersion"
          if ($installedVersion -ne '0.6.22.0') { throw "Installed version $installedVersion is not 0.6.22.0" }
          node scripts/qualify-windows-install-folder.mjs installed "$installDir" "$folderId"
          if ($LASTEXITCODE -ne 0) { throw 'The installer did not protect the upgraded folder' }
          node scripts/qualify-windows-packaged-runtime.mjs "$installDir" --launch-smoke
      - name: Require the installed WSL runtime to be the one qualified
        shell: pwsh
        run: |
          $installed = (Get-FileHash (Join-Path $env:SCIENT_PACKAGING_INSTALL 'resources/wsl-runtime.tar.gz') -Algorithm SHA256).Hash
          $qualified = (Get-FileHash wsl-qualification/wsl-runtime.tar.gz -Algorithm SHA256).Hash
          if ($installed -ne $qualified) { throw "Installed WSL runtime $installed is not the uploaded $qualified" }
      # Last: each install here replaces the registered upgrade install above.
      - name: Install into a fresh, a shared and a linked folder
        shell: pwsh
        timeout-minutes: 10
        run: node scripts/qualify-windows-install-folder.mjs fixtures (Resolve-Path 'release/Scient-0.6.22-x64.exe').Path
      # The installer and its blockmap are already compressed; deflating them again only costs time.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-packaging-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Save Spectre-mitigated MSVC libraries
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.spectre_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.msvc.outputs.spectre }}
          key: ${{ steps.spectre_cache.outputs.cache-primary-key }}
      - name: Save native runtimes
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.native_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native-runtimes
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Save the resource monitor
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.resource_monitor_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/scient-resource-monitor.exe
          key: ${{ steps.resource_monitor_cache.outputs.cache-primary-key }}
      - name: Save Electron downloads
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.electron_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ steps.electron_cache.outputs.cache-primary-key }}

  # Runs once the installer job has ended, so no runner waits for the build. It also runs after
  # a failed installer job, so a payload uploaded before a late failure is still qualified. It
  # takes only the artifact and SHA-256 that this installer execution reported, also on a rerun of
  # this job alone; with none, it fails. The installer job's own failure still fails the run.
  qualify_wsl_runtime:
    name: Windows packaging / Packaged WSL Linux runtime
    needs: package_windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the installer's own WSL payload
        env:
          STARTED: ${{ needs.package_windows.outputs.started_attempt }}
          UPLOADED: ${{ needs.package_windows.outputs.wsl_attempt }}
          ARTIFACT_ID: ${{ needs.package_windows.outputs.wsl_artifact_id }}
          SHA256: ${{ needs.package_windows.outputs.wsl_sha256 }}
          INSTALL_SCRIPT_SHA256: ${{ needs.package_windows.outputs.wsl_install_script_sha256 }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ || ! "$SHA256" =~ ^[0-9a-f]{64}$ || ! "$INSTALL_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The installer job reported no WSL payload." >&2
            exit 1
          fi
          if [[ ! "$STARTED" =~ ^[0-9]+$ || "$UPLOADED" != "$STARTED" ]]; then
            echo "The installer job's latest execution (attempt ${STARTED:-unknown}) uploaded no WSL payload; attempt ${UPLOADED:-unknown} did." >&2
            exit 1
          fi
      # The probe uses only Node built-ins and the uploaded install script; the payload must
      # supply every package itself, so the workspace is neither checked out nor installed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /package.json
            /scripts/qualify-wsl-runtime.mjs
            /scripts/scient-wsl-qualification.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package_windows.outputs.wsl_artifact_id }}
          path: wsl-qualification
      - name: Exercise the exact Linux payload from the Windows package
        env:
          ATTEMPT: ${{ needs.package_windows.outputs.wsl_attempt }}
          SHA256: ${{ needs.package_windows.outputs.wsl_sha256 }}
          INSTALL_SCRIPT_SHA256: ${{ needs.package_windows.outputs.wsl_install_script_sha256 }}
        run: |
          set -euo pipefail
          payload="$(find wsl-qualification -name wsl-runtime.tar.gz -type f)"
          test "$(printf '%s\n' "$payload" | wc -l)" -eq 1
          echo "$SHA256  $payload" | sha256sum --check --strict
          node scripts/qualify-wsl-runtime.mjs "$payload" "$ATTEMPT" "$SHA256" "$INSTALL_SCRIPT_SHA256"
