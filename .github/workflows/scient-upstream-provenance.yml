name: Scient Upstream Provenance

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify upstream provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout owned history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch official T3 main
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream-verification/main

      - name: Verify upstream provenance and Scient seams
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          VERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ALLOW_QUEUE_MERGES: ${{ github.event_name == 'merge_group' && 'true' || 'false' }}
          ALLOW_OWNED_HEAD_MERGE: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          node scripts/verify-upstream-provenance.mjs \
            --base "$VERIFY_BASE" \
            --head "$VERIFY_HEAD" \
            --allow-queue-merges "$ALLOW_QUEUE_MERGES" \
            --allow-owned-head-merge "$ALLOW_OWNED_HEAD_MERGE" \
            --official-ref refs/remotes/upstream-verification/main
          # Every scient-*-seams.json manifest in one pass: each changed path
          # matching a seam's signals must be classified, and every owned path
          # and mount anchor must hold. A PR's base can be newer than its branch,
          # so a PR is checked as GitHub's merge of it into that base.
          seam_head="$VERIFY_HEAD"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin "$GITHUB_SHA"
            if [ "$(git rev-parse "$GITHUB_SHA^1")" != "$VERIFY_BASE" ] ||
              [ "$(git rev-parse "$GITHUB_SHA^2")" != "$VERIFY_HEAD" ]; then
              echo "$GITHUB_SHA is not the merge of $VERIFY_HEAD into $VERIFY_BASE." >&2
              exit 1
            fi
            seam_head="$GITHUB_SHA"
          fi
          node scripts/scient-seam-check.mjs \
            --base "$VERIFY_BASE" \
            --head "$seam_head"
