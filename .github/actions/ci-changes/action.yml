name: CI changes
description: Decide which CI jobs a change needs. See .github/scripts/ci-changes.cjs.
outputs:
  typecheck:
    value: ${{ steps.detect.outputs.typecheck }}
  build:
    value: ${{ steps.detect.outputs.build }}
  test:
    value: ${{ steps.detect.outputs.test }}
  test_packages:
    value: ${{ steps.detect.outputs.test_packages }}
  test_web:
    value: ${{ steps.detect.outputs.test_web }}
  test_server:
    value: ${{ steps.detect.outputs.test_server }}
  rust:
    value: ${{ steps.detect.outputs.rust }}
  release_smoke:
    value: ${{ steps.detect.outputs.release_smoke }}
  mobile_native:
    value: ${{ steps.detect.outputs.mobile_native }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      # SCIENT-FORK:START — every detector uses the event base and tested commit, queue included.
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      run: |
        set -uo pipefail

        decide() {
          node .github/scripts/ci-changes.cjs "$@" | tee -a "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"
        }

        fail_open() {
          echo "$* Running every job."
          decide
        }

        [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_open "Missing comparison base."
        git cat-file -e "$BASE_SHA^{commit}" || fail_open "Comparison base is unavailable."
        # NULs preserve whitespace, newlines and non-UTF-8 paths. No rename scoring:
        # both the removed and added names must participate in package ownership.
        git diff --name-only --no-renames -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths" \
          || fail_open "Could not resolve changed paths."
        if [[ "$EVENT_NAME" == push ]]; then
          decide --paths0 "$RUNNER_TEMP/changed-paths" --full
        fi
        decide --paths0 "$RUNNER_TEMP/changed-paths"
      # SCIENT-FORK:END
